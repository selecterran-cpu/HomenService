<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영업맵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#E8001C;--blue:#185FA5;--ink:#1d1f23;--sub:#5b616b;--mute:#8a9099;--line:#e3e6ea;--bg:#f5f6f8;--card:#fff;--soft:#f1f3f6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn:disabled{opacity:.5;cursor:default}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:15px}
.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:var(--mute);font-size:12px}

/* 로그인 */
#login{display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card h1{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 4px}
.msg{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;line-height:1.5}
.msg.ok{color:#1E9E5A}
.swap{text-align:center;margin-top:14px;font-size:13px;color:var(--sub)}
.swap a{color:var(--blue);font-weight:600}

/* 앱 */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me b{font-size:14px}
.me .role{color:var(--sub)}
.body{flex:1;display:flex;min-height:0}
aside{width:360px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 0;border:0;background:none;font-size:14px;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.tabs .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px}
.pane{flex:1;overflow:auto;padding:12px;display:none}
.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;color:var(--sub)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.item{padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:var(--soft)}
.item .t{display:flex;align-items:center;gap:7px;font-weight:600}
.item .t .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;color:#fff;font-weight:600;flex:none}
.empty{color:var(--mute);text-align:center;padding:30px 10px;font-size:13px}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:14px 2px 4px}
.grp.late{color:var(--red)}

#mapWrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
.mapctl{position:absolute;left:10px;top:10px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mapctl .lg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.mapctl .lg span{display:inline-flex;align-items:center;gap:4px}
.mapctl label{display:flex;align-items:center;gap:6px;color:var(--sub);cursor:pointer}
.mapctl input{width:auto}
.bctl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:300px}
.bchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:11px;color:var(--mute)}
.bchip.on{color:var(--ink);border-color:#9aa0a8;font-weight:600}
.bchip i{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:800}
.bchip:not(.on) i{opacity:.35}
.bpin{width:24px;height:24px;border-radius:7px;background:var(--bc);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;position:relative;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;line-height:1}
.bpin.sm{width:19px;height:19px;border-radius:6px;font-size:10px}
.bpin.done{opacity:.35;filter:saturate(.4)}
.bpin.new:after{content:'N';position:absolute;right:-7px;top:-7px;width:13px;height:13px;border-radius:50%;background:var(--red);border:1.5px solid #fff;color:#fff;font-size:8px;font-weight:800;display:grid;place-items:center}
.bhint{color:var(--mute);font-weight:400}
.mctog{display:block;border:0;background:none;padding:0 0 6px;font-size:12px;font-weight:700;color:var(--ink)}
#mapctl.fold .mctog{padding:0}
#mapctl.fold #mcBody{display:none}
.locbtn{position:absolute;right:10px;bottom:24px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

.pin{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;position:relative}
.pin.other{width:12px;height:12px;opacity:.5}
.pin.spin{width:22px;height:22px;background:#fff!important;border:2px solid var(--red);color:var(--red);font-size:11px;font-weight:700;display:grid;place-items:center}
.pin.stop{display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;line-height:1}
.pin.other.stop{opacity:.6}
.pin.sel{outline:3px solid rgba(232,0,28,.35);outline-offset:2px}
.pin .lbl{display:none;position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:500;color:var(--ink);pointer-events:none}
.show-labels .pin .lbl{display:block}
.pick{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:10px 12px;width:240px;font-size:13px}
.pick:after{content:'';position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pick .addr{font-weight:600;line-height:1.4;margin-bottom:2px;white-space:normal;word-break:keep-all}
.pick .sub{color:var(--mute);font-size:11px;margin-bottom:8px}
.medot{position:relative;width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:pointer}
.medot:before{content:'';position:absolute;inset:-9px;border-radius:50%;background:rgba(26,115,232,.25);animation:mepulse 2s ease-out infinite}
@keyframes mepulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.locbtn.on{color:#1A73E8;border-color:#1A73E8;font-weight:700}
.pickdot{width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 2px var(--red),0 2px 6px rgba(0,0,0,.3)}
.show-labels .pin.other .lbl{opacity:.9}

/* 상세 시트 */
.sheet{position:fixed;right:0;top:0;bottom:0;width:410px;max-width:100%;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.14);z-index:50;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:18px;flex:1}
.sheet .bd{flex:1;overflow:auto;padding:4px 16px 24px}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sec:first-child{border-top:0;margin-top:8px}
.sec h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.meta{font-size:13px;color:var(--sub);line-height:1.7}
.meta a{color:var(--blue)}
.steps{display:flex;gap:4px}
.steps button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--sub)}
.steps button.on{color:#fff;font-weight:700}
.log{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.log:last-child{border-bottom:0}
.log .lh{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:12px;margin-bottom:3px}
.log .lh .x{margin-left:auto;border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px}
.log.done{opacity:.5}
.log input[type=checkbox]{width:auto;margin:0}
.danger{color:var(--red);border-color:#f3c2c8}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}

.stopbox{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#3B3F46;color:#fff;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.stopbox .btn{background:#fff;color:var(--ink);border-color:#fff;flex:none}
table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st th,table.st td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.st th{color:var(--sub);font-weight:600}
table.st td:first-child,table.st th:first-child{text-align:left}
table.st tr.tot td{font-weight:700;background:var(--soft)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rtsum{background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0 6px;font-size:13px;line-height:1.6}
.rtsum b{font-size:15px}
.rtitem{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rtitem:hover{background:var(--soft)}
.rtno{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--red);color:var(--red);font-size:12px;font-weight:700;display:grid;place-items:center;background:#fff}
.rtitem .tm{color:var(--sub);font-size:12px;font-weight:600}
.rtitem .gap{color:var(--mute);font-size:11px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin:6px 0 14px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1f23;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* 모바일 전용 요소 (PC에서는 숨김) */
#mnav,.grab,#menuBtn,#menuPop{display:none}

@media (max-width:760px){
  html,body{overflow:hidden;overscroll-behavior:none}
  #app{height:100vh;height:100dvh}
  header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));position:relative;z-index:30}
  .brand{font-size:15px}
  .me{gap:8px}
  .me .role,#pwBtn,#logoutBtn{display:none}
  #menuBtn{display:inline-block;padding:6px 12px;font-size:18px;line-height:1}
  #menuPop:not([hidden]){display:block;position:absolute;right:10px;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;min-width:180px}
  #menuPop .who{padding:12px 16px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
  #menuPop button{display:block;width:100%;text-align:left;padding:14px 16px;border:0;background:#fff;font-size:15px}
  #menuPop button:active{background:var(--soft)}

  /* 지도 전체화면 + 아래에서 올라오는 패널 */
  .body{position:relative;display:block}
  #mapWrap{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:64%;border:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16);z-index:20;transition:transform .25s ease}
  #app.mmap aside{transform:translateY(105%);box-shadow:none}
  aside .tabs{display:none}
  .grab{display:flex;justify-content:center;align-items:center;flex:none;height:26px;cursor:pointer}
  .grab i{width:40px;height:5px;border-radius:3px;background:#d3d7dd}
  .pane{padding:4px 14px 16px}

  /* 하단 탭바 */
  #mnav{display:flex;flex:none;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:30}
  #mnav button{flex:1;height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);position:relative}
  #mnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #mnav button.on{color:var(--red);font-weight:700}
  #mnav .cnt{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;font-weight:700}

  /* 지도 위 컨트롤 */
  .mapctl{font-size:11px;padding:6px 8px;left:8px;top:8px;max-width:calc(100% - 70px)}
  .mapctl .lg{gap:6px;margin-bottom:4px}
  .locbtn{bottom:14px;right:10px;padding:10px 14px;font-size:14px}

  /* 터치하기 쉽게 */
  input,select,textarea{font-size:16px;padding:11px 12px}
  .btn{padding:11px 14px;font-size:15px}
  .btn.sm{padding:9px 12px;font-size:14px}
  .chip{padding:7px 12px;font-size:13px}
  .item{padding:13px 8px}
  .item .t{font-size:15px}
  .item .s{font-size:13px}
  .tabs button{padding:12px 0}

  /* 상세·등록 화면은 아래에서 올라오는 시트 */
  .sheet{top:auto;height:90%;height:90dvh;width:100%;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .sheet .hd{padding:14px 16px 12px}
  .sheet .bd{padding:4px 16px calc(24px + env(safe-area-inset-bottom))}
  .steps button{padding:10px 0;font-size:14px}
  .modal{align-items:flex-end;padding:0}
  .modal .card{max-width:none;border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  #login .card{padding:24px 20px}
  .pick{width:min(260px,80vw)}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  table.st th,table.st td{padding:8px 3px}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <h1><span class="mark">B</span>영업맵</h1>
    <div class="muted">공용 영업 DB · 담당자 로그인</div>
    <label class="f" for="lid">아이디</label>
    <input id="lid" name="username" autocomplete="username" required>
    <label class="f" for="lpw">비밀번호</label>
    <input id="lpw" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:18px;padding:11px">로그인</button>
    <div id="loginMsg" class="msg"></div>
    <div class="swap">처음 사용하시나요? <a href="#" id="toSignup">가입 신청</a></div>
  </form>
  <form class="card" id="signupForm" hidden>
    <h1><span class="mark">B</span>가입 신청</h1>
    <div class="muted">신청 후 지점장이 승인하면 로그인할 수 있습니다.</div>
    <label class="f" for="sid">아이디 (영문 소문자·숫자 3~20자)</label>
    <input id="sid" autocomplete="username" required>
    <label class="f" for="sname">이름</label>
    <input id="sname" required>
    <label class="f" for="spw">비밀번호 (6자 이상)</label>
    <input id="spw" type="password" autocomplete="new-password" required>
    <label class="f" for="spw2">비밀번호 확인</label>
    <input id="spw2" type="password" autocomplete="new-password" required>
    <button class="btn primary" id="signupBtn" style="width:100%;margin-top:18px;padding:11px">가입 신청</button>
    <div id="signupMsg" class="msg"></div>
    <div class="swap"><a href="#" id="toLogin">로그인으로 돌아가기</a></div>
  </form>
</div>

<!-- 메인 -->
<div id="app" hidden>
  <header>
    <div class="brand"><span class="mark">B</span>영업맵</div>
    <div class="me"><b id="meName"></b><span class="role" id="meRole"></span><button class="btn sm" id="pwBtn">비밀번호 변경</button><button class="btn sm" id="logoutBtn">로그아웃</button><button class="btn sm" id="menuBtn" aria-label="메뉴">⋯</button></div>
    <div id="menuPop" hidden>
      <div class="who" id="menuWho"></div>
      <button id="mPw">비밀번호 변경</button>
      <button id="mLogout">로그아웃</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <div class="grab" id="grab" title="지도 보기"><i></i></div>
      <nav class="tabs">
        <button data-tab="list" class="on">영업DB</button>
        <button data-tab="search">장소검색</button>
        <button data-tab="recontact">재접촉<span class="cnt" id="rcCnt" hidden></span></button>
        <button data-tab="stats">현황</button>
        <button data-tab="admin" id="adminTab" hidden>직원<span class="cnt" id="pendCnt" hidden></span></button>
      </nav>

      <section class="pane on" id="pane-list">
        <div class="chips" id="statusChips"></div>
        <div class="row" style="margin-bottom:8px">
          <input id="listQ" placeholder="상호·주소 검색">
          <select id="ownerFilter" hidden></select>
        </div>
        <div class="row" style="margin:4px 2px 6px;align-items:center">
          <div class="muted" id="listCount"></div>
          <button class="btn sm" id="xlsBtn" style="flex:none">엑셀 다운로드</button>
        </div>
        <div id="list"></div>
      </section>

      <section class="pane" id="pane-search">
        <form class="row" id="searchForm" style="margin-bottom:10px">
          <input id="searchQ" placeholder="예: 송도 부동산, ○○상가">
          <button class="btn blue" style="flex:none">검색</button>
        </form>

// 대시보드 주소, 프로젝트 ID만, /rest/v1 이 붙은 주소 등 어떤 형태로 넣어도 https://ID.supabase.co 로 맞춤
function normalizeSupabaseUrl(v) {
  let u = String(v || '').trim().replace(/^['"‘’“”]+|['"‘’“”]+$/g, '');
  const dash = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if (dash) return `https://${dash[1].toLowerCase()}.supabase.co`;
  if (/^[a-z0-9]{15,30}$/i.test(u)) return `https://${u.toLowerCase()}.supabase.co`;
  if (!/^https?:\/\//i.test(u) && /\.supabase\.co/i.test(u)) u = 'https://' + u;
  u = u.replace(/^http:\/\//i, 'https://');
  const m = u.match(/^(https:\/\/[^\/\s?#]+)/i);
  return m ? m[1] : u;
}

function loadKakao() {
  return new Promise((resolve, reject) => {
    if (window.kakao?.maps?.services) return resolve();
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
    s.onload = () => window.kakao ? kakao.maps.load(resolve) : reject();
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function keepPopupVisible(lat, lng) {
  const b = map.getBounds(), N = b.getNorthEast().getLat(), S = b.getSouthWest().getLat(), E = b.getNorthEast().getLng(), W = b.getSouthWest().getLng();
  const c = map.getCenter(); let cy = c.getLat(), cx = c.getLng(), move = false;
  if ((N - lat) / (N - S) < 0.45) { cy = lat + (N - S) * 0.2; move = true; }
  const fx = (lng - W) / (E - W);
  if (fx < 0.3 || fx > 0.7) { cx = lng; move = true; }
  if (move) map.panTo(new kakao.maps.LatLng(cy, cx));
}

    $('#bldChk').disabled = true; $('#bldHint').textContent = '(데이터 없음)'; return;
  }
  const saved = lsGet('salesmap.bld');
  if (saved) { BLD.on = !!saved.on; BLD.types = new Set(saved.types || [1, 2, 3, 4]); BLD.newOnly = !!saved.newOnly; }
  $('#bldChk').checked = BLD.on;
  renderBldCtl();
  $('#bldChk').addEventListener('change', e => { BLD.on = e.target.checked; BLD.lastMsg = ''; saveBld(); renderBldCtl(); renderBld(true); });
  $('#bldCtl').addEventListener('change', e => {
    if (e.target.id !== 'bldGo' || !e.target.value) return;
    const a = BLD.index.areas.find(x => x.code === e.target.value); if (!a) return;
    e.target.value = ''; toMapOnMobile();
    (async () => {
      if (!BLD.cache[a.code]) { $('#bldHint').textContent = '(불러오는 중…)'; await loadArea(a); }
      const rows = BLD.cache[a.code].rows.filter(r => r[2] === 1);   // 상가가 모인 곳(중심가)으로
      const src = rows.length ? rows : BLD.cache[a.code].rows;
      if (!src.length) return;
      const med = arr => arr.sort((x, y) => x - y)[arr.length >> 1];
      map.setLevel(4); map.setCenter(new kakao.maps.LatLng(med(src.map(r => r[0])), med(src.map(r => r[1]))));
    })();
  });
  $('#bldCtl').addEventListener('click', e => {
    const c = e.target.closest('.bchip'); if (!c) return;
    if (c.dataset.t === 'new') BLD.newOnly = !BLD.newOnly;
    else { const t = +c.dataset.t; BLD.types.has(t) ? BLD.types.delete(t) : BLD.types.add(t); }
    saveBld(); renderBldCtl(); renderBld();
  });
  kakao.maps.event.addListener(map, 'idle', () => { if (BLD.on) renderBld(); });
  if (BLD.on) renderBld();
}
function saveBld() { lsSet('salesmap.bld', { on: BLD.on, types: [...BLD.types], newOnly: BLD.newOnly }); }
function renderBldCtl() {
  $('#bldCtl').hidden = !BLD.on;
  $('#bldCtl').innerHTML = Object.entries(BTYPE).map(([t, n]) => `<button class="bchip${BLD.types.has(+t) ? ' on' : ''}" data-t="${t}"><i style="background:${BCOLOR[t]}">${BLETTER[t]}</i>${n}</button>`).join('')
    + `<button class="bchip${BLD.newOnly ? ' on' : ''}" data-t="new"><i style="background:var(--red);border-radius:50%">N</i>신축 ${NEW_YEARS}년만</button>`
    + `<select id="bldGo" style="width:100%;margin-top:4px;padding:5px 8px;font-size:12px"><option value="">데이터 있는 지역으로 이동…</option>${
        BLD.index.areas.filter(a => a.n >= 300).sort((x, y) => x.name.localeCompare(y.name)).map(a => `<option value="${a.code}">${esc(a.name.replace(/^\S+\s/, ''))} (${a.n.toLocaleString()}동)</option>`).join('')}</select>`;
  if (!BLD.on) { bldClear(); $('#bldHint').textContent = ''; }
}
function bldClear() { BLD.overlays.forEach(o => o.setMap(null)); BLD.overlays = []; }
async function loadArea(a) {
  try {
    const r = await fetch(BLD.base + a.file);
    if (!r.ok) throw new Error(r.status);
    BLD.cache[a.code] = await r.json();
  } catch { BLD.cache[a.code] = { rows: [], prefix: a.name, code: a.code }; toast(`${a.name} 건물 데이터를 불러오지 못했습니다`); }
}
const bldId = (d, r) => `bld:${d.code}-${r[10]}`;
const bldAddr = (d, r) => [d.prefix, r[4]].filter(Boolean).join(' ');

function bldMsg(hint, msg, force) {
  $('#bldHint').textContent = hint;
  if (msg && (force || BLD.lastMsg !== msg)) toast(msg, 4500);
  BLD.lastMsg = msg || '';
}
async function renderBld(force) {
  const seq = ++BLD.seq;
  if (!BLD.on || !BLD.index) { bldClear(); return; }
  if (map.getLevel() > BLEVEL) { bldClear(); bldMsg('(더 확대하면 보입니다)', '건물은 지도를 동네 단위까지 확대하면 나타납니다', force); return; }
  const bd = map.getBounds(), sw = bd.getSouthWest(), ne = bd.getNorthEast();
  const S = sw.getLat(), W = sw.getLng(), N = ne.getLat(), E = ne.getLng();
  const areas = BLD.index.areas.filter(a => !(a.bbox[2] < S || a.bbox[0] > N || a.bbox[3] < W || a.bbox[1] > E));
  if (!areas.length) {
    bldClear();
    const names = [...new Set(BLD.index.areas.filter(a => a.n > 1000).map(a => a.name.split(' ')[1]))].slice(0, 6).join(', ');
    bldMsg('(이 지역 데이터 없음)', `지금 보는 지역은 건물 데이터가 없습니다. 데이터가 있는 곳: ${names} 등`, force);
    return;
  }
  const need = areas.filter(a => !BLD.cache[a.code]);
  if (need.length) { $('#bldHint').textContent = '(불러오는 중…)'; await Promise.all(need.map(loadArea)); }
  if (seq !== BLD.seq) return;   // 그 사이 지도를 또 움직였으면 최신 것만 그림

  const minYear = new Date().getFullYear() - NEW_YEARS;
  const reg = prospects.concat(others);
  const regIds = new Set(reg.map(p => p.kakao_place_id).filter(Boolean));
  let list = [];
  for (const a of areas) {
    const d = BLD.cache[a.code];
    for (const r of d.rows) {
      if (r[0] < S || r[0] > N || r[1] < W || r[1] > E) continue;
      if (!BLD.types.has(r[2])) continue;
      if (BLD.newOnly && !(r[9] >= minYear)) continue;
      list.push([r, d]);
    }
  }
  const total = list.length;
  if (total > BMAX) {
    const c = map.getCenter(), cy = c.getLat(), cx = c.getLng();
    list.sort((x, y) => ((x[0][0] - cy) ** 2 + (x[0][1] - cx) ** 2) - ((y[0][0] - cy) ** 2 + (y[0][1] - cx) ** 2));
    list = list.slice(0, BMAX);
  }
  bldClear();
  const small = map.getLevel() >= BLEVEL;   // 멀리서 볼 때는 조금 작게
  for (const [r, d] of list) {
    // 이미 등록된 건물이거나 20m 안에 등록된 영업대상이 있으면 흐리게
    const done = regIds.has(bldId(d, r)) || reg.some(p => Math.abs(p.lat - r[0]) < 0.00018 && Math.abs(p.lng - r[1]) < 0.00023);
    const el = document.createElement('div');
    el.className = 'bpin' + (small ? ' sm' : '') + (done ? ' done' : '') + (r[9] >= minYear ? ' new' : '');
    el.style.setProperty('--bc', BCOLOR[r[2]]);
    el.textContent = BLETTER[r[2]];
    el.title = r[3] || BTYPE[r[2]];
    el.addEventListener('click', e => { e.stopPropagation(); lastPinClick = Date.now(); showBldPop(r, d, done); });
    ['mousedown', 'touchstart'].forEach(t => el.addEventListener(t, () => lastPinClick = Date.now()));
    BLD.overlays.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(r[0], r[1]), content: el, xAnchor: .5, yAnchor: .5, zIndex: 2 }));
  }
  bldMsg(total > BMAX ? `(${total.toLocaleString()}동 중 가까운 ${BMAX}동)` : `(${total.toLocaleString()}동)`,
    total ? '' : '이 화면에는 선택한 용도의 건물이 없습니다', force);
}

function showBldPop(r, d, done) {
  hidePick();
  const title = (r[3] && r[5] && !r[3].includes(r[5]) ? `${r[3]} ${r[5]}` : (r[3] || r[5])) || BTYPE[r[2]];
  const spec = [
    r[6] != null ? `지상 ${r[6]}층` + (r[7] ? ` / 지하 ${r[7]}층` : '') : '',
    r[8] ? `연면적 ${r[8].toLocaleString()}㎡` : '',
    r[9] ? `${r[9]}년 준공` : ''
  ].filter(Boolean).join(' · ');
  const id = bldId(d, r);
  const mine = prospects.find(p => p.kakao_place_id === id);
  const el = document.createElement('div');
  el.className = 'pick'; el.style.marginBottom = '12px';
  el.innerHTML = `<div class="addr">${esc(title)}</div>
    <div class="sub" style="line-height:1.5"><b style="color:${BCOLOR[r[2]]}">${esc(r[11] || BTYPE[r[2]])}</b><br>${esc(bldAddr(d, r))}${spec ? '<br>' + esc(spec) : ''}
    ${done ? '<br><span style="color:var(--red)">근처에 이미 등록된 영업대상이 있습니다</span>' : ''}</div>
    <div class="row"><button class="btn sm" data-x>닫기</button>${mine ? `<button class="btn sm" data-open style="flex:1.6">등록됨 · 보기</button>` : `<button class="btn sm primary" data-reg style="flex:1.6">영업DB 등록</button>`}</div>`;
  ['click', 'mousedown', 'touchstart', 'dblclick'].forEach(t => el.addEventListener(t, ev => ev.stopPropagation()));
  el.querySelector('[data-x]').addEventListener('click', hidePick);
  el.querySelector('[data-open]')?.addEventListener('click', () => { hidePick(); openDetail(mine.id); });
  el.querySelector('[data-reg]')?.addEventListener('click', () => {
    hidePick();
    const jibun = bldAddr(d, r);
    openRegister({ name: r[3] ? title : '', address: jibun, category: r[11] || BTYPE[r[2]], phone: '', lat: r[0], lng: r[1], place_id: id });
    // 도로명 주소가 있으면 바꿔 넣기
    reverseAddr(r[0], r[1]).then(a => { if (a && $('#rAddr').value === jibun) $('#rAddr').value = a; });
  });
  pickOverlay = new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(r[0], r[1]), content: el, xAnchor: .5, yAnchor: 1, zIndex: 9 });
  keepPopupVisible(r[0], r[1]);
}

/* ---------------- 내 위치 ---------------- */
let meDot = null, meCircle = null, meWatch = null, mePos = null, meFollow = false;
function drawMe(pos) {
  const ll = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
  const acc = Math.min(pos.coords.accuracy || 0, 2000);
  mePos = ll;
  if (!meDot) {
    const el = document.createElement('div'); el.className = 'medot'; el.title = '내 위치';
    el.addEventListener('click', e => { e.stopPropagation(); lastPinClick = Date.now(); showPick(mePos); });
    meDot = new kakao.maps.CustomOverlay({ map, position: ll, content: el, xAnchor: .5, yAnchor: .5, zIndex: 7 });
    meCircle = new kakao.maps.Circle({ map, center: ll, radius: acc, strokeWeight: 1, strokeColor: '#1A73E8', strokeOpacity: .5, fillColor: '#1A73E8', fillOpacity: .1 });
  } else {
    meDot.setPosition(ll); meCircle.setPosition(ll); meCircle.setRadius(acc);
  }
  if (meFollow) { map.panTo(ll); meFollow = false; }
}
function locateMe() {
  if (!navigator.geolocation) return toast('이 기기에서는 위치 정보를 사용할 수 없습니다');
  hidePick(); toMapOnMobile();
  if (mePos) { map.setLevel(3); map.panTo(mePos); }
  meFollow = true;
  $('#locBtn').textContent = '◎ 찾는 중…';
  const opt = { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 };
  const fail = err => {
    $('#locBtn').textContent = '◎ 내 위치'; $('#locBtn').classList.remove('on');
    if (err.code === 1) toast('위치 권한이 꺼져 있습니다. 브라우저 주소창 옆 설정(또는 휴대폰 설정)에서 위치 허용 후 다시 눌러주세요', 6000);
    else if (err.code === 3) toast('위치를 찾는 데 시간이 걸리고 있습니다. 잠시 후 다시 눌러주세요');
    else toast('현재 위치를 찾지 못했습니다');
  };
  navigator.geolocation.getCurrentPosition(pos => {
    $('#locBtn').textContent = '◎ 내 위치'; $('#locBtn').classList.add('on');
    if (map.getLevel() > 3) map.setLevel(3);
    drawMe(pos);
    // 화면을 켜두는 동안 위치 점을 계속 갱신 (지도는 따라가지 않음)
    if (meWatch === null) meWatch = navigator.geolocation.watchPosition(drawMe, () => {}, opt);
  }, fail, opt);
}

let lastPinClick = 0, pickOverlay = null, pickDot = null;
function hidePick() {
  pickOverlay?.setMap(null); pickDot?.setMap(null);
  pickOverlay = pickDot = null;
}

function makePin(color, label, cls, onClick, inner = '') {
  const el = document.createElement('div');
  el.className = 'pin ' + (cls || '');

function renderMarkers() {
  overlays.forEach(o => o.setMap(null)); overlays = [];
  if (showOthers) others.forEach(x => {
    const st = x.status === '중지';
    const el = makePin(SCOLOR[x.status] || '#999', `${x.name} · ${x.owner_name}`, 'other' + (st ? ' stop' : ''),
      () => toast(`${x.name} — 담당 ${x.owner_name} · ${x.status}${st ? ' (방문 자제)' : ''}`), st ? '×' : '');
    overlays.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(x.lat, x.lng), content: el, xAnchor: .5, yAnchor: .5, zIndex: 1 }));
  });
  filtered().forEach(p => {
    const st = p.status === '중지';
    const el = makePin(SCOLOR[p.status], p.name, (p.id === openId ? 'sel' : '') + (st ? ' stop' : ''), () => openDetail(p.id), st ? '×' : '');

  });
}

/* ---------------- 데이터 ---------------- */
async function loadMembers() {
  const { data, error } = await sb.from('profiles').select('id,login_id,name,branch,part,role,approved').order('name');
  if (dbErr(error, '담당자 목록을 불러오지 못했습니다')) return;
  memberMap = Object.fromEntries(data.map(m => [m.id, m]));
  members = data.filter(m => m.approved && m.branch === me.branch);
  pending = data.filter(m => !m.approved && !m.branch);
  inactive = data.filter(m => !m.approved && m.branch === me.branch);
  if (me.role === '지점장') {
    $('#adminTab').hidden = false;
    $('#pendCnt').hidden = !pending.length; $('#pendCnt').textContent = pending.length; syncNav();
    if (curTab === 'admin') renderAdmin();
  }
  const vis = me.role === '지점장' ? members : me.role === '파트장' ? members.filter(m => m.part === me.part) : [];
  const sel = $('#ownerFilter');
  sel.hidden = vis.length === 0;
  sel.innerHTML = `<option value="">담당자 전체</option>` + vis.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
}

function assignable() {
  if (me.role === '지점장') return members;
  if (me.role === '파트장') return members.filter(m => m.part === me.part);
  return [me];
}

async function reloadAll() {
  const [p, o, r] = await Promise.all([
    sb.from('prospects').select('*').order('updated_at', { ascending: false }),
    sb.rpc('branch_map'),
    sb.from('recontacts').select('id,prospect_id,due_date,due_time,note,user_id').eq('done', false).order('due_date').order('due_time', { nullsFirst: false })
  ]);
  if (dbErr(p.error, '영업DB를 불러오지 못했습니다')) return;
  prospects = p.data || [];
  const mine = new Set(prospects.map(x => x.id));
  others = (o.data || []).filter(x => !mine.has(x.id));
  recontacts = r.data || [];
  renderMarkers(); renderList(); renderRecontacts(); renderBadge();
  if (BLD.on) renderBld();
  if (curTab === 'stats') renderStats();
  if (curTab === 'search') renderSearch(false);
}

let rlT;
function subscribe() {
  const reload = () => { clearTimeout(rlT); rlT = setTimeout(async () => {
    await reloadAll();
    if (openId && !prospects.find(p => p.id === openId)) closeSheet();
  }, 600); };
  sb.channel('salesmap')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prospects' }, reload)
    .subscribe();
}

  $('#listQ').addEventListener('input', e => { filter.q = e.target.value.trim(); renderMarkers(); renderList(); });
  $('#ownerFilter').addEventListener('change', e => { filter.owner = e.target.value; renderMarkers(); renderList(); });
  $('#othersChk').addEventListener('change', e => { showOthers = e.target.checked; renderMarkers(); });

  $('#catChips').innerHTML = CATS.map(([c, n]) => `<button class="chip" data-c="${c}">${n}</button>`).join('');
  $('#catChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#catChips .chip').forEach(x => x.classList.toggle('on', x === b));
    addrResults = [];
    places.categorySearch(b.dataset.c, searchCb, { useMapBounds: true });
  });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#searchQ').value.trim(); if (!q) return;
    document.querySelectorAll('#catChips .chip').forEach(x => x.classList.remove('on'));
    addrResults = []; searchResults = [];
    // 주소 검색과 상호 검색을 동시에
    geocoder.addressSearch(q, (res, st) => {
      addrResults = st === kakao.maps.services.Status.OK ? res.slice(0, 5) : [];
      renderSearch(false);
      if (addrResults.length && !searchResults.length && !isMobile()) moveToAddr(0);
    });
    places.keywordSearch(q, searchCb, { location: map.getCenter() });
  });

  $('#sClose').addEventListener('click', closeSheet);
  $('#regCancel').addEventListener('click', () => $('#regModal').hidden = true);
  $('#regModal').addEventListener('click', e => { if (e.target.id === 'regModal') $('#regModal').hidden = true; });
  $('#regForm').addEventListener('submit', saveRegister);

  $('#adminBox').addEventListener('click', adminClick);
  $('#xlsBtn').addEventListener('click', exportExcel);
  $('#statSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setStatView(b.dataset.v); });
  $('#rtDate').addEventListener('change', loadRoute);
  $('#rtUser').addEventListener('change', loadRoute);
  $('#rtPrev').addEventListener('click', () => shiftRouteDate(-1));
  $('#rtNext').addEventListener('click', () => shiftRouteDate(1));
  $('#rtToday').addEventListener('click', () => { $('#rtDate').value = today(); loadRoute(); });
  $('#routeBox').addEventListener('click', e => {
    if (e.target.id === 'rtMap') { toMapOnMobile(); return drawRoute(routeStops); }
    const it = e.target.closest('.rtitem'); if (it) focusStop(+it.dataset.i);
  });

  $('#pwBtn').addEventListener('click', () => { $('#pwForm').reset(); $('#pwMsg').textContent = ''; $('#pwModal').hidden = false; $('#np1').focus(); });
  $('#pwCancel').addEventListener('click', () => $('#pwModal').hidden = true);
  $('#stopCancel').addEventListener('click', () => $('#stopModal').hidden = true);
  $('#stopForm').addEventListener('submit', saveStop);
  $('#stopReasons').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    document.querySelectorAll('#stopReasons .chip').forEach(x => x.classList.toggle('on', x === c));
  });
  $('#pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('#np1').value, p2 = $('#np2').value;
    if (p1.length < 6) return $('#pwMsg').textContent = '6자 이상으로 입력하세요.';
    if (p1 !== p2) return $('#pwMsg').textContent = '비밀번호 확인이 일치하지 않습니다.';
    $('#pwSave').disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    $('#pwSave').disabled = false;
    if (error) return $('#pwMsg').textContent = /different|same/i.test(error.message) ? '기존과 다른 비밀번호를 입력하세요.' : '변경 실패: ' + error.message;
    $('#pwModal').hidden = true; toast('비밀번호를 변경했습니다');
  });

  $('#locBtn').addEventListener('click', locateMe);
}

function filtered() {
  const q = filter.q.toLowerCase();
  return prospects.filter(p =>
    filter.status.has(p.status) &&
    (!filter.owner || p.owner_id === filter.owner) &&
    (!q || (p.name + ' ' + (p.address || '')).toLowerCase().includes(q)));
}

function renderList() {
  STATUS.forEach(s => {
    const n = prospects.filter(p => p.status === s && (!filter.owner || p.owner_id === filter.owner)).length;
    const el = document.querySelector(`#statusChips [data-c="${s}"]`); if (el) el.textContent = ' ' + n;
  });
  const arr = filtered();
  $('#listCount').textContent = `${arr.length}건`;
  $('#list').innerHTML = arr.length ? arr.map(p => `
    <div class="item" data-id="${p.id}">
      <div class="t"><span class="nm">${esc(p.name)}</span><span class="badge" style="background:${SCOLOR[p.status]}">${p.status}</span></div>
      <div class="s">${esc(p.address || '')}</div>
      <div class="s">${esc(ownerName(p.owner_id))} · ${ymd(p.updated_at)}${p.category ? ' · ' + esc(p.category) : ''}</div>
    </div>`).join('') : `<div class="empty">등록된 영업대상이 없습니다.<br>[장소검색] 탭에서 등록해보세요.</div>`;
}
$('#list').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const p = prospects.find(x => x.id == it.dataset.id); if (!p) return;
  toMapOnMobile(); map.panTo(new kakao.maps.LatLng(p.lat, p.lng)); openDetail(p.id);
});

/* ---------------- 장소검색 ---------------- */
function searchCb(data, status, pagination) {
  const append = appendNext; appendNext = false;
  if (status === kakao.maps.services.Status.ZERO_RESULT) {
    if (!append) searchResults = [];
    searchPager = null; renderSearch(false); return;
  }
  if (status !== kakao.maps.services.Status.OK) return toast('검색 중 오류가 발생했습니다');
  searchResults = append ? searchResults.concat(data) : data;
  searchPager = pagination;
  renderSearch(!append);
}

function clearSearchPins() { searchOverlays.forEach(o => o.setMap(null)); searchOverlays = []; }

function dupOf(placeId) {
  const p = prospects.find(x => x.kakao_place_id === placeId);
  if (p) return { mine: true, id: p.id, owner: ownerName(p.owner_id), status: p.status };
  const o = others.find(x => x.kakao_place_id === placeId);
  if (o) return { mine: false, id: o.id, owner: o.owner_name, status: o.status };
  return null;
}

let addrResults = [];
const addrText = r => r.road_address?.address_name || r.address?.address_name || r.address_name;
function moveToAddr(i) {
  const r = addrResults[i]; if (!r) return;
  toMapOnMobile();
  const pos = new kakao.maps.LatLng(+r.y, +r.x);
  map.setLevel(3); map.setCenter(pos);
  showPick(pos);
}

function renderSearch(fit) {
  clearSearchPins();
  const box = $('#searchList');
  if (!searchResults.length && !addrResults.length) { box.innerHTML = `<div class="empty">검색 결과가 없습니다.<br>주소로 찾을 때는 "송도동 123" 또는 "센트럴로 160"처럼 입력해 보세요.</div>`; return; }
  const bounds = new kakao.maps.LatLngBounds();
  const addrHtml = addrResults.length ? `<div class="grp" style="margin-top:2px">주소 검색 결과</div>` + addrResults.map((r, i) => {
    const road = r.road_address?.address_name, jibun = r.address?.address_name;
    const bld = r.road_address?.building_name;
    return `<div class="item" data-ai="${i}">
      <div class="t"><span class="nm">${esc(road || jibun || r.address_name)}</span></div>
      ${road && jibun ? `<div class="s">지번 ${esc(jibun)}</div>` : ''}${bld ? `<div class="s">${esc(bld)}</div>` : ''}
      <div class="row" style="margin-top:6px"><button class="btn sm" data-amove="${i}">지도에서 보기</button><button class="btn sm primary" data-areg="${i}">이 주소로 등록</button></div>
    </div>`;
  }).join('') + (searchResults.length ? `<div class="grp">장소 검색 결과</div>` : '') : '';
  box.innerHTML = addrHtml + searchResults.map((d, i) => {
    const dup = dupOf(d.id);
    const cat = (d.category_name || '').split('>').pop().trim();
    const btn = dup
      ? (dup.mine ? `<button class="btn sm" data-open="${dup.id}">등록됨 · 보기</button>`
                  : `<span class="muted">담당 ${esc(dup.owner)}</span>`)
      : `<button class="btn sm primary" data-reg="${i}">영업DB 등록</button>`;
    return `<div class="item" data-i="${i}">
      <div class="t"><span class="nm">${i + 1}. ${esc(d.place_name)}</span>${dup ? `<span class="badge" style="background:${SCOLOR[dup.status]}">${dup.status}</span>` : ''}</div>
      <div class="s">${esc(d.road_address_name || d.address_name)}</div>
      <div class="row" style="margin-top:6px"><span class="s" style="margin:0">${esc(cat)}${d.phone ? ' · ' + esc(d.phone) : ''}</span><span style="flex:none">${btn}</span></div>
    </div>`;
  }).join('') + (searchPager?.hasNextPage ? `<button class="btn sm" id="moreBtn" style="width:100%;margin-top:10px">결과 더 보기</button>` : '');

  if (curTab === 'search') searchResults.forEach((d, i) => {
    const pos = new kakao.maps.LatLng(+d.y, +d.x); bounds.extend(pos);
    const el = makePin('#fff', d.place_name, 'spin', () => focusSearch(i), String(i + 1));
    searchOverlays.push(new kakao.maps.CustomOverlay({ map, position: pos, content: el, xAnchor: .5, yAnchor: .5, zIndex: 5 }));
  });
  if (fit && curTab === 'search' && searchResults.length) map.setBounds(bounds);
  const more = $('#moreBtn');
  if (more) more.addEventListener('click', () => { appendNext = true; searchPager.nextPage(); });
}

// 모바일: 검색 결과를 지도 위 작은 창으로 (상호 + 등록 버튼)
function showPlacePop(i) {
  const d = searchResults[i]; if (!d) return;
  hidePick();
  const pos = new kakao.maps.LatLng(+d.y, +d.x);
  const dup = dupOf(d.id);
  const el = document.createElement('div');
  el.className = 'pick';
  el.style.marginBottom = '18px';
  el.innerHTML = `<div class="addr">${i + 1}. ${esc(d.place_name)}</div>
    <div class="sub">${esc(d.road_address_name || d.address_name)}${d.phone ? ' · ' + esc(d.phone) : ''}</div>
    <div class="row"><button class="btn sm" data-x>닫기</button>${dup
      ? (dup.mine ? `<button class="btn sm" data-open style="flex:1.6">등록됨 · 보기</button>` : `<span class="muted" style="flex:1.6;text-align:center">담당 ${esc(dup.owner)}</span>`)
      : `<button class="btn sm primary" data-reg style="flex:1.6">영업DB 등록</button>`}</div>`;
  ['click', 'mousedown', 'touchstart', 'dblclick'].forEach(t => el.addEventListener(t, ev => ev.stopPropagation()));
  el.querySelector('[data-x]').addEventListener('click', hidePick);
  el.querySelector('[data-open]')?.addEventListener('click', () => { hidePick(); openDetail(dup.id); });
  el.querySelector('[data-reg]')?.addEventListener('click', () => {
    hidePick();
    openRegister({ name: d.place_name, address: d.road_address_name || d.address_name,
      category: (d.category_name || '').split('>').pop().trim(), phone: d.phone, lat: +d.y, lng: +d.x, place_id: d.id });
  });
  pickOverlay = new kakao.maps.CustomOverlay({ map, position: pos, content: el, xAnchor: .5, yAnchor: 1, zIndex: 9 });
  keepPopupVisible(+d.y, +d.x);
}

function focusSearch(i) {
  if (isMobile()) { setMView('map'); const d = searchResults[i]; map.panTo(new kakao.maps.LatLng(+d.y, +d.x)); return showPlacePop(i); }
  const d = searchResults[i];
  map.panTo(new kakao.maps.LatLng(+d.y, +d.x));
  const it = document.querySelector(`#searchList .item[data-i="${i}"]`);
  if (it) { it.scrollIntoView({ block: 'center', behavior: 'smooth' }); it.style.background = '#fff3f4'; setTimeout(() => it.style.background = '', 1200); }
}

$('#searchList').addEventListener('click', e => {
  const areg = e.target.closest('[data-areg]');
  if (areg) {
    const r = addrResults[+areg.dataset.areg]; hidePick();
    return openRegister({ name: r.road_address?.building_name || '', address: addrText(r), category: '', phone: '', lat: +r.y, lng: +r.x, place_id: null });
  }
  const amove = e.target.closest('[data-amove]') || e.target.closest('[data-ai]');
  if (amove) return moveToAddr(+(amove.dataset.amove ?? amove.dataset.ai));
  const reg = e.target.closest('[data-reg]');
  if (reg) {
    const d = searchResults[+reg.dataset.reg];
    return openRegister({
      name: d.place_name, address: d.road_address_name || d.address_name,
      category: (d.category_name || '').split('>').pop().trim(), phone: d.phone,
      lat: +d.y, lng: +d.x, place_id: d.id
    });
  }
  const op = e.target.closest('[data-open]');
  if (op) return openDetail(+op.dataset.open);
  const it = e.target.closest('.item');
  if (it) focusSearch(+it.dataset.i);
});

function manualRegister() {
  const c = map.getCenter();
  geocoder.coord2Address(c.getLng(), c.getLat(), (res, st) => {
    let addr = '';
    if (st === kakao.maps.services.Status.OK && res[0]) addr = res[0].road_address?.address_name || res[0].address?.address_name || '';
    openRegister({ name: '', address: addr, category: '', phone: '', lat: c.getLat(), lng: c.getLng(), place_id: null });
    toast('지도 중심 위치로 등록합니다. 위치를 옮기려면 지도를 먼저 이동하세요.');
  });
}

/* ---------------- 등록 ---------------- */
let regDraft = null;
function openRegister(d) {
  regDraft = d;
  $('#rName').value = d.name || ''; $('#rAddr').value = d.address || '';
  $('#rCat').value = d.category || ''; $('#rPhone').value = d.phone || '';
  $('#rStatus').innerHTML = opts(FLOW, '발굴');
  $('#rOwner').innerHTML = assignable().map(m => `<option value="${m.id}"${m.id === me.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
  $('#rOwner').disabled = !isLeader();
  $('#rNet').innerHTML = opts(CARRIERS, '미확인'); $('#rTv').innerHTML = opts(CARRIERS, '미확인');
  $('#rMemo').value = '';
  $('#rDate').value = today(); $('#rTime').innerHTML = timeOpts(nowSlot());
  $('#regCoord').textContent = `위치 ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
  $('#regModal').hidden = false;
  setTimeout(() => (d.name ? $('#rStatus') : $('#rName')).focus(), 50);
}

async function saveRegister(e) {
  e.preventDefault();
  const d = regDraft; if (!d) return;
  const row = {
    name: $('#rName').value.trim(), address: $('#rAddr').value.trim() || null,
    category: $('#rCat').value.trim() || null, phone: $('#rPhone').value.trim() || null,
    lat: d.lat, lng: d.lng, kakao_place_id: d.place_id || null,
    status: $('#rStatus').value, owner_id: $('#rOwner').value || me.id,
    internet_carrier: $('#rNet').value, tv_carrier: $('#rTv').value,
    memo: $('#rMemo').value.trim() || null,
    reg_date: $('#rDate').value || today(), reg_time: $('#rTime').value || null
  };
  if (!row.name) return toast('상호를 입력하세요');
  $('#regSave').disabled = true;
  if (!row.address) row.address = (await reverseAddr(row.lat, row.lng)) || null;
  const { data, error } = await sb.from('prospects').insert(row).select().single();
  $('#regSave').disabled = false;
  if (dbErr(error)) return;
  $('#regModal').hidden = true;
  toast(`${data.name} 등록 완료`);
  await reloadAll();
  openDetail(data.id);
}

function reverseAddr(lat, lng) {
  return new Promise(resolve => geocoder.coord2Address(lng, lat, (res, st) => {
    if (st === kakao.maps.services.Status.OK && res[0]) resolve(res[0].road_address?.address_name || res[0].address?.address_name || '');
    else resolve('');
  }));
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('주소를 복사했습니다'); }
  catch { prompt('아래 주소를 복사하세요', t); }
}

/* ---------------- 상세 ---------------- */
function closeSheet() { $('#sheet').hidden = true; openId = null; renderMarkers(); }

async function openDetail(id) {
  const p = prospects.find(x => x.id === id);
  if (!p) return toast('조회 권한이 없는 영업대상입니다');
  openId = id; renderMarkers();
  $('#sTitle').textContent = p.name;
  $('#sheet').hidden = false;
  $('#sBody').innerHTML = `<div class="empty">불러오는 중…</div>`;
  const [a, r, s] = await Promise.all([
    sb.from('activities').select('*').eq('prospect_id', id).order('visit_date', { ascending: false }).order('visit_time', { ascending: false, nullsFirst: false }).order('id', { ascending: false }),
    sb.from('recontacts').select('*').eq('prospect_id', id).order('done').order('due_date').order('due_time', { nullsFirst: false }),
    sb.from('results').select('*').eq('prospect_id', id).order('result_date', { ascending: false })
  ]);
  if (openId !== id) return;
  const acts = (a.data || []).sort((x, y) => dt(y.visit_date, y.visit_time).localeCompare(dt(x.visit_date, x.visit_time)) || y.id - x.id);
  const recs = (r.data || []).sort((x, y) => (x.done - y.done) || dt(x.due_date, x.due_time).localeCompare(dt(y.due_date, y.due_time)));
  renderDetail(p, acts, recs, s.data || []);
}

async function updateProspect(id, patch, msg) {
  const { data, error } = await sb.from('prospects').update(patch).eq('id', id).select().maybeSingle();
  if (dbErr(error)) return null;
  if (!data) { toast('변경 후 조회 권한이 없어졌습니다'); await reloadAll(); closeSheet(); return null; }
  const i = prospects.findIndex(x => x.id === id); if (i >= 0) prospects[i] = data;
  renderMarkers(); renderList();
  if (msg) toast(msg);
  return data;
}

let stopTarget = null;
function openStop(p) {
  stopTarget = p;
  $('#stopName').textContent = p.name;
  $('#stopReasons').innerHTML = STOP_REASONS.map((r, i) => `<button type="button" class="chip${i === 0 ? ' on' : ''}" data-r="${r}">${r}</button>`).join('');
  $('#stopMemo').value = ''; $('#stopCancelRc').checked = true;
  $('#stopModal').hidden = false;
}
async function saveStop(e) {
  e.preventDefault();
  const p = stopTarget; if (!p) return;
  const reason = $('#stopReasons .chip.on')?.dataset.r || '기타';
  const memo = $('#stopMemo').value.trim();
  const full = memo ? `${reason} - ${memo}` : reason;
  $('#stopSave').disabled = true;
  const d = await updateProspect(p.id, { status: '중지', stop_reason: full, stopped_at: new Date().toISOString() });
  if (d) {
    await sb.from('activities').insert({ prospect_id: p.id, visit_date: today(), visit_time: nowHM(), kind: '중지', content: '영업 중지: ' + full });
    if ($('#stopCancelRc').checked) await sb.from('recontacts').update({ done: true }).eq('prospect_id', p.id).eq('done', false);
    await loadRecontacts();
    $('#stopModal').hidden = true;
    toast(`${p.name} 영업 중지 (${reason})`);
    openDetail(p.id);
  }
  $('#stopSave').disabled = false;
}

    else toast('성과를 등록했습니다');

  $('#sBody').onclick = async e => {
    const t = e.target;
    if (t.dataset.rc) {

async function renderStats() {
  const box = $('#stats');
  const { data: res } = await sb.from('results').select('prospect_id,qty');
  const resBy = {};
  (res || []).forEach(r => {
    const p = prospects.find(x => x.id === r.prospect_id); if (!p) return;
    resBy[p.owner_id] = (resBy[p.owner_id] || 0) + r.qty;
  });
  const ownerIds = [...new Set(prospects.map(p => p.owner_id))];
  const rows = ownerIds.map(o => {
    const c = Object.fromEntries(STATUS.map(s => [s, prospects.filter(p => p.owner_id === o && p.status === s).length]));
    return { o, c, tot: STATUS.reduce((n, s) => n + c[s], 0), res: resBy[o] || 0 };
  }).sort((a, b) => b.res - a.res || b.tot - a.tot);
  const tc = Object.fromEntries(STATUS.map(s => [s, prospects.filter(p => p.status === s).length]));
  const total = prospects.length, totRes = rows.reduce((n, r) => n + r.res, 0);
  const t = today(), late = recontacts.filter(r => r.due_date < t).length;
  const scope = me.role === '지점장' ? `${me.branch} 전체` : me.role === '파트장' ? `${me.part} 파트` : '내 담당';

  box.innerHTML = `
    <div class="grp" style="margin-top:2px">${esc(scope)} · 영업대상 ${total}곳 · 성과 ${totRes}건${late ? ` · <span style="color:var(--red)">재접촉 지연 ${late}</span>` : ''}</div>
    <div class="bar">${total ? STATUS.map(s => `<span style="width:${tc[s] / total * 100}%;background:${SCOLOR[s]}" title="${s} ${tc[s]}"></span>`).join('') : ''}</div>
    <table class="st">
      <tr><th>담당자</th>${STATUS.map(s => `<th>${s}</th>`).join('')}<th>계</th><th>성과건</th></tr>
      ${rows.map(r => `<tr><td>${esc(ownerName(r.o))}</td>${STATUS.map(s => `<td>${r.c[s] || ''}</td>`).join('')}<td>${r.tot}</td><td><b>${r.res || ''}</b></td></tr>`).join('')}
      ${rows.length > 1 ? `<tr class="tot"><td>합계</td>${STATUS.map(s => `<td>${tc[s]}</td>`).join('')}<td>${total}</td><td>${totRes}</td></tr>` : ''}
    </table>
    ${rows.length ? '' : '<div class="empty">아직 데이터가 없습니다.</div>'}`;
}

/* ---------------- 동선 ---------------- */
let routeOverlays = [], statView = 'stats', routeStops = [];
const localYmd = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function clearRoute() { routeOverlays.forEach(o => o.setMap(null)); routeOverlays = []; }
function setStatView(v) {
  statView = v;
  document.querySelectorAll('#statSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#stats').hidden = v !== 'stats'; $('#routeBox').hidden = v !== 'route';
  if (v === 'stats') { clearRoute(); renderStats(); }
  else { initRouteCtl(); loadRoute(); }
}
function initRouteCtl() {
  if (!$('#rtDate').value) $('#rtDate').value = today();
  const sel = $('#rtUser'), list = assignable(), cur = sel.value || me.id;
  sel.innerHTML = list.map(m => `<option value="${m.id}"${m.id === cur ? ' selected' : ''}>${esc(m.name)}${m.part ? ' (' + esc(m.part) + ')' : ''}</option>`).join('');
  sel.disabled = list.length <= 1;
}
function shiftRouteDate(days) {
  const d = new Date(($('#rtDate').value || today()) + 'T12:00:00'); d.setDate(d.getDate() + days);
  $('#rtDate').value = localYmd(d); loadRoute();
}
async function loadRoute() {
  const date = $('#rtDate').value || today(), uid = $('#rtUser').value || me.id;
  $('#rtSum').innerHTML = '<div class="empty">불러오는 중…</div>'; $('#rtList').innerHTML = '';
  const { data, error } = await sb.from('activities').select('id,prospect_id,kind,content,visit_time,created_at').eq('user_id', uid).eq('visit_date', date).order('created_at');
  if (dbErr(error, '동선을 불러오지 못했습니다')) return;
  const pmap = Object.fromEntries(prospects.map(p => [p.id, p]));
  const hidden = (data || []).filter(a => !pmap[a.prospect_id]).length;
  const ev = (data || []).filter(a => pmap[a.prospect_id]).map(a => ({ hm: hm(a.visit_time) || hhmm(a.created_at), ct: a.created_at, p: pmap[a.prospect_id], kind: a.kind || '활동', text: a.content }));
  prospects.filter(p => p.created_by === uid && (p.reg_date || localYmd(p.created_at)) === date)
    .forEach(p => ev.push({ hm: hm(p.reg_time) || hhmm(p.created_at), ct: p.created_at, p, kind: '신규등록', text: '' }));
  ev.sort((a, b) => a.hm.localeCompare(b.hm) || new Date(a.ct) - new Date(b.ct));
  // 같은 곳 연속 기록은 한 번의 방문으로 묶음
  const stops = [];
  ev.forEach(e => { const last = stops[stops.length - 1]; if (last && last.p.id === e.p.id) last.items.push(e); else stops.push({ p: e.p, hm: e.hm, items: [e] }); });
  routeStops = stops;
  const dist = drawRoute(stops);
  renderRouteList(stops, uid, date, dist, hidden);
}
function drawRoute(stops) {
  clearRoute();
  if (!stops.length) return 0;
  const path = stops.map(s => new kakao.maps.LatLng(s.p.lat, s.p.lng));
  let dist = 0;
  if (path.length > 1) {
    const line = new kakao.maps.Polyline({ path, strokeWeight: 4, strokeColor: '#E8001C', strokeOpacity: .8, strokeStyle: 'solid' });
    line.setMap(map); routeOverlays.push(line); dist = line.getLength();
  }
  const bounds = new kakao.maps.LatLngBounds();
  stops.forEach((s, i) => {
    bounds.extend(path[i]);
    const el = makePin('#fff', `${i + 1}. ${s.p.name}`, 'spin', () => focusStop(i), String(i + 1));
    routeOverlays.push(new kakao.maps.CustomOverlay({ map, position: path[i], content: el, xAnchor: .5, yAnchor: .5, zIndex: 6 }));
  });
  if (path.length === 1) { map.setLevel(3); map.setCenter(path[0]); } else map.setBounds(bounds);
  return dist;
}
function renderRouteList(stops, uid, date, dist, hidden) {
  const who = memberMap[uid]?.name || me.name;
  if (!stops.length) {
    $('#rtSum').innerHTML = `<div class="rtsum"><b>${esc(who)}</b> · ${date}<br>이 날짜에 기록된 활동이 없습니다.${hidden ? `<br><span class="muted">조회 권한이 없는 곳의 활동 ${hidden}건 제외</span>` : ''}</div>`;
    return;
  }
  const first = stops[0].hm, last = stops[stops.length - 1].items.at(-1).hm;
  $('#rtSum').innerHTML = `<div class="rtsum"><b>${esc(who)}</b> · ${date}<br>
    방문 <b>${stops.length}</b>곳 · 이동 약 <b>${(dist / 1000).toFixed(1)}</b>km (직선 기준) · ${first} ~ ${last}
    ${hidden ? `<br><span class="muted">조회 권한이 없는 곳의 활동 ${hidden}건 제외</span>` : ''}</div>
    <button class="btn sm" id="rtMap" style="width:100%;margin-bottom:4px">지도에서 동선 보기</button>`;
  $('#rtList').innerHTML = stops.map((s, i) => {
    const prev = stops[i - 1];
    const mins = x => +x.slice(0, 2) * 60 + +x.slice(3, 5);
    const gap = prev ? mins(s.hm) - mins(prev.items.at(-1).hm) : null;
    const kinds = [...new Set(s.items.map(e => e.kind))].join('·');
    const text = s.items.map(e => e.text).filter(Boolean).join(' / ');
    return `<div class="rtitem" data-i="${i}"><span class="rtno">${i + 1}</span>
      <div style="flex:1;min-width:0">
        <div><span class="tm">${s.hm}</span> <b>${esc(s.p.name)}</b> <span class="badge" style="background:${SCOLOR[s.p.status]}">${s.p.status}</span></div>
        <div class="s" style="font-size:12px;color:var(--sub);margin-top:2px">${esc(kinds)}${text ? ' · ' + esc(text) : ''}</div>
        ${gap !== null && gap >= 0 ? `<div class="gap">이전 방문 후 ${gap >= 60 ? Math.floor(gap / 60) + '시간 ' : ''}${gap % 60}분</div>` : ''}
      </div></div>`;
  }).join('');
}
function focusStop(i) {
  const s = routeStops[i]; if (!s) return;
  toMapOnMobile(); map.setLevel(3); map.panTo(new kakao.maps.LatLng(s.p.lat, s.p.lng));
  const it = document.querySelector(`#rtList .rtitem[data-i="${i}"]`);
  if (it && !isMobile()) { it.scrollIntoView({ block: 'center', behavior: 'smooth' }); it.style.background = '#fff3f4'; setTimeout(() => it.style.background = '', 1200); }
}

/* ---------------- 엑셀 다운로드 ---------------- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function fetchAll(table, cols) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select(cols).range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

    const [acts, recs, ress] = await Promise.all([
      fetchAll('activities', 'prospect_id,visit_date,visit_time,kind,content,user_id'),
      fetchAll('recontacts', 'prospect_id,due_date,due_time,note,done'),
      fetchAll('results', 'prospect_id,product,qty,result_date')
    ]);
    const group = list => { const m = {}; list.filter(x => ids.has(x.prospect_id)).forEach(x => (m[x.prospect_id] ||= []).push(x)); return m; };
    const actBy = group(acts), recBy = group(recs.filter(r => !r.done)), resBy = group(ress);
    Object.values(actBy).forEach(l => l.sort((a, b) => dt(b.visit_date, b.visit_time).localeCompare(dt(a.visit_date, a.visit_time))));
    Object.values(recBy).forEach(l => l.sort((a, b) => dt(a.due_date, a.due_time).localeCompare(dt(b.due_date, b.due_time))));

    const rows = arr.map(p => {
      const la = actBy[p.id]?.[0], nr = recBy[p.id]?.[0], rs = resBy[p.id] || [];
      return {
        '상호': p.name, '상태': p.status, '담당자': ownerName(p.owner_id), '파트': memberMap[p.owner_id]?.part || '',
        '주소': p.address || '', '유형': p.category || '', '전화': p.phone || '',
        '인터넷': p.internet_carrier || '', 'TV': p.tv_carrier || '',
        '활동횟수': actBy[p.id]?.length || 0, '최근활동일시': la ? dt(la.visit_date, la.visit_time) : '', '최근활동내용': la?.content || '',
        '다음재접촉일시': nr ? dt(nr.due_date, nr.due_time) : '', '재접촉내용': nr?.note || '',
        '성과건수': rs.reduce((n, r) => n + r.qty, 0), '성과상품': [...new Set(rs.map(r => r.product))].join(', '),
        '중지사유': p.status === '중지' ? (p.stop_reason || '') : '', '메모': p.memo || '', '등록일시': p.reg_date ? dt(p.reg_date, p.reg_time) : ymd(p.created_at), '수정일': ymd(p.updated_at)
      };
    });
    const pName = Object.fromEntries(arr.map(p => [p.id, p]));
    const actRows = Object.entries(actBy).flatMap(([pid, l]) => l.map(a => ({
      '상호': pName[pid].name, '주소': pName[pid].address || '', '활동일': ymd(a.visit_date), '시간': hm(a.visit_time), '구분': a.kind || '',
      '내용': a.content, '작성자': ownerName(a.user_id)
    }))).sort((a, b) => (b['활동일'] + b['시간']).localeCompare(a['활동일'] + a['시간']));

    const fname = `영업DB_${me.branch || ''}_${today().replace(/-/g, '')}`;
    if (!window.XLSX) { try { await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); } catch {} }
    if (window.XLSX) {
      const wb = XLSX.utils.book_new();
      const sheet = (data, widths) => {
        const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ '내용': '데이터 없음' }]);
        ws['!cols'] = widths.map(w => ({ wch: w }));
        return ws;
      };
      XLSX.utils.book_append_sheet(wb, sheet(rows, [22, 6, 8, 8, 32, 10, 14, 7, 7, 7, 11, 30, 11, 24, 7, 14, 30, 11, 11]), '영업대상');
      XLSX.utils.book_append_sheet(wb, sheet(actRows, [22, 32, 11, 7, 6, 50, 8]), '활동이력');
      XLSX.writeFile(wb, fname + '.xlsx');
    } else {
      // 엑셀 라이브러리를 못 불러오면 엑셀에서 열리는 CSV로
      const keys = Object.keys(rows[0]);
      const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const csv = '﻿' + [keys.map(cell).join(','), ...rows.map(r => keys.map(k => cell(r[k])).join(','))].join('\r\n');
      downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fname + '.csv');
    }
    toast(`${rows.length}건을 내려받았습니다`);
  } catch (e) {
    dbErr(e, '다운로드하지 못했습니다');
  } finally {
    btn.disabled = false; btn.textContent = '엑셀 다운로드';
  }
}

/* ---------------- 직원 관리 (지점장) ---------------- */
function renderAdmin() {
  const parts = [...new Set(members.concat(inactive).map(m => m.part).filter(Boolean))].sort();
  const roleSel = (id, v) => `<select data-role="${id}" style="flex:.8">${opts(['매니저', '파트장', '지점장'], v || '매니저')}</select>`;
  const head = (m, extra = '') => `<div class="lh"><b style="color:var(--ink);font-size:14px">${esc(m.name)}</b><span>${esc(m.login_id)}</span>${extra}</div>`;

  const pend = pending.map(m => `
    <div class="log">${head(m)}
      <div class="row"><input list="partList" placeholder="파트 (예: 1파트)" data-part="${m.id}">${roleSel(m.id)}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-reject="${m.id}">거절</button><button class="btn sm primary" data-approve="${m.id}">승인</button></div>
    </div>`).join('') || '<div class="muted" style="padding:6px 2px">승인 대기 중인 신청이 없습니다.</div>';

  const mem = members.map(m => m.id === me.id
    ? `<div class="log">${head(m, `<span>· ${esc(m.role)} · 본인</span>`)}</div>`
    : `<div class="log">${head(m)}
        <div class="row"><input list="partList" value="${esc(m.part || '')}" placeholder="파트" data-part="${m.id}">${roleSel(m.id, m.role)}</div>
        <div class="row" style="margin-top:6px"><button class="btn sm danger" data-off="${m.id}">사용 중지</button><button class="btn sm blue" data-save="${m.id}">변경 저장</button></div>
      </div>`).join('');

  const ina = inactive.map(m => `
    <div class="log done" style="opacity:.7">${head(m, `<span>· ${esc(m.part || '')} ${esc(m.role || '')}</span>`)}
      <button class="btn sm" data-on="${m.id}">다시 사용</button>
    </div>`).join('');

  $('#adminBox').innerHTML = `
    <datalist id="partList">${parts.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div class="row" style="align-items:center"><div class="grp" style="margin:0">승인 대기 ${pending.length}</div><button class="btn sm" id="admReload" style="flex:none">새로고침</button></div>
    ${pend}
    <div class="grp">직원 ${members.length}명 · ${esc(me.branch)}</div>
    ${mem}
    ${inactive.length ? `<div class="grp">사용 중지 ${inactive.length}</div>${ina}` : ''}`;
}

async function adminClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'admReload') { await loadMembers(); return toast('새로고침했습니다'); }
  const d = b.dataset, id = d.approve || d.reject || d.save || d.off || d.on;
  if (!id) return;
  const box = $('#adminBox');
  const part = (box.querySelector(`[data-part="${id}"]`)?.value || '').trim() || null;
  const role = box.querySelector(`[data-role="${id}"]`)?.value || '매니저';
  const prof = () => sb.from('profiles');
  let q, msg;
  if (d.approve) { q = prof().update({ branch: me.branch, part, role, approved: true }).eq('id', id); msg = `${memberMap[id]?.name} 승인 완료`; }
  else if (d.reject) { if (!confirm('가입 신청을 거절할까요?')) return; q = prof().delete().eq('id', id); msg = '거절했습니다'; }
  else if (d.save) { q = prof().update({ part, role }).eq('id', id); msg = '변경했습니다'; }
  else if (d.off) { if (!confirm(`${memberMap[id]?.name}님의 사용을 중지할까요? 로그인할 수 없게 됩니다.`)) return; q = prof().update({ approved: false }).eq('id', id); msg = '사용을 중지했습니다'; }
  else { q = prof().update({ approved: true }).eq('id', id); msg = '다시 사용할 수 있게 했습니다'; }
  b.disabled = true;
  const { data, error } = await q.select();
  b.disabled = false;
  if (dbErr(error)) return;
  if (!data?.length) return toast('권한이 없습니다');
  toast(msg);
  await loadMembers(); renderList();
}

init();
</script>
