<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영업맵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#E8001C;--blue:#185FA5;--ink:#1d1f23;--sub:#5b616b;--mute:#8a9099;--line:#e3e6ea;--bg:#f5f6f8;--card:#fff;--soft:#f1f3f6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn:disabled{opacity:.5;cursor:default}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:15px}
.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:var(--mute);font-size:12px}

/* 로그인 */
#login{display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card h1{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 4px}
.msg{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;line-height:1.5}
.msg.ok{color:#1E9E5A}
.swap{text-align:center;margin-top:14px;font-size:13px;color:var(--sub)}
.swap a{color:var(--blue);font-weight:600}

/* 앱 */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me b{font-size:14px}
.me .role{color:var(--sub)}
.body{flex:1;display:flex;min-height:0}
aside{width:360px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 0;border:0;background:none;font-size:14px;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.tabs .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px}
.pane{flex:1;overflow:auto;padding:12px;display:none}
.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;color:var(--sub)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.item{padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:var(--soft)}
.item .t{display:flex;align-items:center;gap:7px;font-weight:600}
.item .t .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;color:#fff;font-weight:600;flex:none}
.empty{color:var(--mute);text-align:center;padding:30px 10px;font-size:13px}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:14px 2px 4px}
.grp.late{color:var(--red)}

#mapWrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
.mapctl{position:absolute;left:10px;top:10px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mapctl .lg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.mapctl .lg span{display:inline-flex;align-items:center;gap:4px}
.mapctl label{display:flex;align-items:center;gap:6px;color:var(--sub);cursor:pointer}
.mapctl input{width:auto}
.locbtn{position:absolute;right:10px;bottom:24px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

.pin{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;position:relative}
.pin.other{width:12px;height:12px;opacity:.5}
.pin.spin{width:22px;height:22px;background:#fff!important;border:2px solid var(--red);color:var(--red);font-size:11px;font-weight:700;display:grid;place-items:center}
.pin.sel{outline:3px solid rgba(232,0,28,.35);outline-offset:2px}
.pin .lbl{display:none;position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:500;color:var(--ink);pointer-events:none}
.show-labels .pin .lbl{display:block}
.show-labels .pin.other .lbl{opacity:.9}

/* 상세 시트 */
.sheet{position:fixed;right:0;top:0;bottom:0;width:410px;max-width:100%;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.14);z-index:50;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:18px;flex:1}
.sheet .bd{flex:1;overflow:auto;padding:4px 16px 24px}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sec:first-child{border-top:0;margin-top:8px}
.sec h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.meta{font-size:13px;color:var(--sub);line-height:1.7}
.meta a{color:var(--blue)}
.steps{display:flex;gap:4px}
.steps button{flex:1;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--sub)}
.steps button.on{color:#fff;font-weight:700}
.log{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.log:last-child{border-bottom:0}
.log .lh{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:12px;margin-bottom:3px}
.log .lh .x{margin-left:auto;border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px}
.log.done{opacity:.5}
.log input[type=checkbox]{width:auto;margin:0}
.danger{color:var(--red);border-color:#f3c2c8}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}

table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st th,table.st td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.st th{color:var(--sub);font-weight:600}
table.st td:first-child,table.st th:first-child{text-align:left}
table.st tr.tot td{font-weight:700;background:var(--soft)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin:6px 0 14px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1f23;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.2)}

@media (max-width:760px){
  header{padding:8px 12px}
  .me .role{display:none}
  .body{flex-direction:column}
  aside{width:100%;height:44%;border-right:0;border-bottom:1px solid var(--line)}
  .sheet{top:auto;height:84%;width:100%;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16)}
  .mapctl{font-size:11px;padding:6px 8px}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <h1><span class="mark">B</span>영업맵</h1>
    <div class="muted">공용 영업 DB · 담당자 로그인</div>
    <label class="f" for="lid">아이디</label>
    <input id="lid" name="username" autocomplete="username" required>
    <label class="f" for="lpw">비밀번호</label>
    <input id="lpw" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:18px;padding:11px">로그인</button>
    <div id="loginMsg" class="msg"></div>
    <div class="swap">처음 사용하시나요? <a href="#" id="toSignup">가입 신청</a></div>
  </form>
  <form class="card" id="signupForm" hidden>
    <h1><span class="mark">B</span>가입 신청</h1>
    <div class="muted">신청 후 지점장이 승인하면 로그인할 수 있습니다.</div>
    <label class="f" for="sid">아이디 (영문 소문자·숫자 3~20자)</label>
    <input id="sid" autocomplete="username" required>
    <label class="f" for="sname">이름</label>
    <input id="sname" required>
    <label class="f" for="spw">비밀번호 (6자 이상)</label>
    <input id="spw" type="password" autocomplete="new-password" required>
    <label class="f" for="spw2">비밀번호 확인</label>
    <input id="spw2" type="password" autocomplete="new-password" required>
    <button class="btn primary" id="signupBtn" style="width:100%;margin-top:18px;padding:11px">가입 신청</button>
    <div id="signupMsg" class="msg"></div>
    <div class="swap"><a href="#" id="toLogin">로그인으로 돌아가기</a></div>
  </form>
</div>

<!-- 메인 -->
<div id="app" hidden>
  <header>
    <div class="brand"><span class="mark">B</span>영업맵</div>
    <div class="me"><b id="meName"></b><span class="role" id="meRole"></span><button class="btn sm" id="pwBtn">비밀번호 변경</button><button class="btn sm" id="logoutBtn">로그아웃</button></div>
  </header>
  <div class="body">
    <aside>
      <nav class="tabs">
        <button data-tab="list" class="on">영업DB</button>
        <button data-tab="search">장소검색</button>
        <button data-tab="recontact">재접촉<span class="cnt" id="rcCnt" hidden></span></button>
        <button data-tab="stats">현황</button>
        <button data-tab="admin" id="adminTab" hidden>직원<span class="cnt" id="pendCnt" hidden></span></button>
      </nav>

      <section class="pane on" id="pane-list">
        <div class="chips" id="statusChips"></div>
        <div class="row" style="margin-bottom:8px">
          <input id="listQ" placeholder="상호·주소 검색">
          <select id="ownerFilter" hidden></select>
        </div>
        <div class="muted" id="listCount" style="margin:4px 2px 6px"></div>
        <div id="list"></div>
      </section>

      <section class="pane" id="pane-search">
        <form class="row" id="searchForm" style="margin-bottom:10px">
          <input id="searchQ" placeholder="예: 송도 부동산, ○○상가">
          <button class="btn blue" style="flex:none">검색</button>
        </form>
        <div class="chips" id="catChips"></div>
        <button class="btn sm" id="manualBtn" style="width:100%;margin-bottom:10px">＋ 지도 중심 위치로 직접 등록</button>
        <div id="searchList"><div class="empty">키워드를 검색하거나 업종을 누르면<br>현재 지도 화면 주변 장소를 찾습니다.</div></div>
      </section>

      <section class="pane" id="pane-recontact"><div id="rcList"></div></section>
      <section class="pane" id="pane-stats"><div id="stats"></div></section>
      <section class="pane" id="pane-admin"><div id="adminBox"></div></section>
    </aside>

    <div id="mapWrap">
      <div id="map"></div>
      <div class="mapctl">
        <div class="lg" id="legend"></div>
        <label><input type="checkbox" id="othersChk" checked> 지점 전체 영업현황 표시</label>
      </div>
      <button class="locbtn" id="locBtn">◎ 내 위치</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="hd"><h2 id="sTitle"></h2><button class="btn sm ghost" id="sClose">닫기 ✕</button></div>
  <div class="bd" id="sBody"></div>
</div>

<div class="modal" id="regModal" hidden>
  <form class="card" id="regForm">
    <h2>영업DB 등록</h2>
    <div class="muted" id="regCoord"></div>
    <label class="f">상호 *</label><input id="rName" required>
    <label class="f">주소</label><input id="rAddr">
    <div class="row">
      <div><label class="f">유형</label><input id="rCat"></div>
      <div><label class="f">전화</label><input id="rPhone"></div>
    </div>
    <div class="row">
      <div><label class="f">상태</label><select id="rStatus"></select></div>
      <div><label class="f">담당자</label><select id="rOwner"></select></div>
    </div>
    <div class="row">
      <div><label class="f">인터넷 사용</label><select id="rNet"></select></div>
      <div><label class="f">TV 사용</label><select id="rTv"></select></div>
    </div>
    <label class="f">메모</label><textarea id="rMemo"></textarea>
    <div class="row" style="margin-top:16px">
      <button type="button" class="btn" id="regCancel">취소</button>
      <button class="btn primary" id="regSave">등록</button>
    </div>
  </form>
</div>

<div class="modal" id="pwModal" hidden>
  <form class="card" id="pwForm">
    <h2>비밀번호 변경</h2>
    <label class="f">새 비밀번호 (6자 이상)</label><input id="np1" type="password" autocomplete="new-password" required>
    <label class="f">새 비밀번호 확인</label><input id="np2" type="password" autocomplete="new-password" required>
    <div id="pwMsg" class="msg"></div>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn" id="pwCancel">취소</button>
      <button class="btn primary" id="pwSave">변경</button>
    </div>
  </form>
</div>

<div id="toast" hidden></div>

<script>
/* =====================================================================
   설정 — 세 값을 채운 뒤 업로드하세요
   SUPABASE_URL / SUPABASE_ANON_KEY : Supabase > Project Settings > API
   KAKAO_JS_KEY : 카카오 developers > 내 애플리케이션 > 앱 키 > JavaScript 키
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',
  KAKAO_JS_KEY: '',
  LOGIN_DOMAIN: 'salesmap.local',          // 아이디 kim → kim@salesmap.local
  DEFAULT_CENTER: [37.3925, 126.6390],     // 송도
  DEFAULT_LEVEL: 5
};

const STATUS = ['발굴','접촉','상담','견적','성과'];
const SCOLOR = {'발굴':'#8A8F98','접촉':'#185FA5','상담':'#E67E22','견적':'#7B4FC9','성과':'#1E9E5A'};
const CARRIERS = ['미확인','SKB','KT','LGU+','케이블','없음'];
const KINDS = ['방문','전화','문자','기타'];
const PRODUCTS = ['인터넷','TV','인터넷+TV','인터넷+TV+전화','기타'];
const CATS = [['AG2','부동산'],['FD6','음식점'],['CE7','카페'],['HP8','병원'],['AC5','학원'],['AD5','숙박'],['MT1','마트']];

let sb, me, members = [], memberMap = {}, pending = [], inactive = [];
let prospects = [], others = [], recontacts = [];
let map, places, geocoder, overlays = [], searchOverlays = [];
let searchResults = [], searchPager = null, appendNext = false;
let showOthers = true, curTab = 'list', openId = null;
const filter = { status: new Set(STATUS), owner: '', q: '' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const ymd = s => s ? String(s).slice(0,10) : '';
const ownerName = id => memberMap[id]?.name || '-';
const isLeader = () => me && (me.role === '지점장' || me.role === '파트장');
const opts = (arr, sel) => arr.map(v => `<option${v === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');

let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}
function dbErr(error, fallback = '저장하지 못했습니다') {
  if (!error) return false;
  console.error(error);
  if (error.code === '23505') toast('이미 영업DB에 등록된 장소입니다');
  else if (error.code === '42501' || /row-level security/i.test(error.message)) toast('권한이 없습니다');
  else toast(fallback + ' (' + (error.message || error.code) + ')', 4000);
  return true;
}

/* ---------------- 시작 / 로그인 ---------------- */
async function init() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || !CONFIG.KAKAO_JS_KEY) {
    $('#login').hidden = false;
    $('#loginMsg').textContent = '파일 상단 CONFIG 설정값을 먼저 채워주세요.';
    $('#loginBtn').disabled = true; $('#signupBtn').disabled = true;
    return;
  }
  ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'KAKAO_JS_KEY'].forEach(k => CONFIG[k] = String(CONFIG[k]).trim());
  const bad = ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'KAKAO_JS_KEY'].filter(k => /[^\x21-\x7E]/.test(CONFIG[k]));
  if (!/^https:\/\/[^\/\s]+\.supabase\.co\/?$/.test(CONFIG.SUPABASE_URL) && !bad.includes('SUPABASE_URL')) bad.push('SUPABASE_URL');
  if (bad.length) {
    $('#login').hidden = false;
    $('#loginMsg').textContent = `CONFIG의 ${bad.join(', ')} 값이 잘못되었습니다. 따옴표 안에 한글·공백 없이 키만 들어 있는지 확인하세요.`;
    $('#loginBtn').disabled = true; $('#signupBtn').disabled = true;
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else showLogin();
}

function showLogin(msg = '', ok = false) {
  $('#app').hidden = true; $('#login').hidden = false;
  showForm('login');
  $('#loginMsg').textContent = msg;
  $('#loginMsg').classList.toggle('ok', ok);
}
function showForm(which) {
  $('#loginForm').hidden = which !== 'login';
  $('#signupForm').hidden = which !== 'signup';
}
$('#toSignup').addEventListener('click', e => { e.preventDefault(); $('#signupMsg').textContent = ''; showForm('signup'); $('#sid').focus(); });
$('#toLogin').addEventListener('click', e => { e.preventDefault(); showForm('login'); });

$('#signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#sid').value.trim().toLowerCase(), name = $('#sname').value.trim();
  const pw = $('#spw').value, pw2 = $('#spw2').value;
  const msg = (t, ok = false) => { $('#signupMsg').textContent = t; $('#signupMsg').classList.toggle('ok', ok); };
  if (!/^[a-z0-9._-]{3,20}$/.test(id)) return msg('아이디는 영문 소문자·숫자 3~20자로 입력하세요.');
  if (!name) return msg('이름을 입력하세요.');
  if (pw.length < 6) return msg('비밀번호는 6자 이상이어야 합니다.');
  if (pw !== pw2) return msg('비밀번호 확인이 일치하지 않습니다.');
  $('#signupBtn').disabled = true; msg('');
  const { data, error } = await sb.auth.signUp({
    email: `${id}@${CONFIG.LOGIN_DOMAIN}`, password: pw,
    options: { data: { login_id: id, name } }
  });
  $('#signupBtn').disabled = false;
  if (error) {
    if (/already|registered|exists/i.test(error.message)) return msg('이미 사용 중인 아이디입니다.');
    if (/not allowed|disabled/i.test(error.message)) return msg('가입 신청이 막혀 있습니다. Supabase에서 가입 허용 설정을 켜주세요.');
    return msg('가입 신청 실패: ' + error.message);
  }
  if (data.session) await sb.auth.signOut();
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return msg('이미 사용 중인 아이디입니다.');
  if (!data.session) return msg('신청은 접수됐지만 이메일 확인 설정이 켜져 있습니다. Supabase에서 Confirm email을 꺼주세요.');
  $('#signupForm').reset();
  showLogin('가입 신청이 완료되었습니다. 지점장 승인 후 로그인할 수 있습니다.', true);
  $('#lid').value = id;
});

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#lid').value.trim(), pw = $('#lpw').value;
  if (!id || !pw) return;
  const email = id.includes('@') ? id : `${id}@${CONFIG.LOGIN_DOMAIN}`;
  $('#loginBtn').disabled = true; $('#loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  $('#loginBtn').disabled = false;
  if (error) { $('#loginMsg').textContent = '아이디 또는 비밀번호가 맞지 않습니다.'; return; }
  enter();
});

$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return showLogin();
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !prof) { await sb.auth.signOut(); return showLogin('담당자 정보가 등록되지 않은 계정입니다. 관리자에게 문의하세요.'); }
  if (!prof.approved) {
    await sb.auth.signOut();
    return showLogin(prof.branch ? '사용이 중지된 계정입니다. 지점장에게 문의하세요.' : '가입 승인 대기 중입니다. 지점장 승인 후 로그인할 수 있습니다.');
  }
  me = prof;
  $('#meName').textContent = me.name;
  $('#meRole').textContent = [me.branch, me.part, me.role].filter(Boolean).join(' · ');
  $('#login').hidden = true; $('#app').hidden = false;

  try { await loadKakao(); }
  catch (e) { toast('카카오맵을 불러오지 못했습니다. JavaScript 키와 사이트 도메인 등록을 확인하세요.', 6000); return; }
  initMap();
  setupUI();
  await loadMembers();
  await reloadAll();
  subscribe();
}

/* ---------------- 카카오맵 ---------------- */
function loadKakao() {
  return new Promise((resolve, reject) => {
    if (window.kakao?.maps?.services) return resolve();
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
    s.onload = () => window.kakao ? kakao.maps.load(resolve) : reject();
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function initMap() {
  map = new kakao.maps.Map($('#map'), {
    center: new kakao.maps.LatLng(...CONFIG.DEFAULT_CENTER), level: CONFIG.DEFAULT_LEVEL
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  places = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();
  const lbl = () => $('#map').classList.toggle('show-labels', map.getLevel() <= 3);
  kakao.maps.event.addListener(map, 'zoom_changed', lbl); lbl();
}

function makePin(color, label, cls, onClick, inner = '') {
  const el = document.createElement('div');
  el.className = 'pin ' + (cls || '');
  el.style.background = color;
  el.innerHTML = inner + `<span class="lbl">${esc(label)}</span>`;
  el.title = label;
  el.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  return el;
}

function renderMarkers() {
  overlays.forEach(o => o.setMap(null)); overlays = [];
  if (showOthers) others.forEach(x => {
    const el = makePin(SCOLOR[x.status] || '#999', `${x.name} · ${x.owner_name}`, 'other',
      () => toast(`${x.name} — 담당 ${x.owner_name} · ${x.status}`));
    overlays.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(x.lat, x.lng), content: el, xAnchor: .5, yAnchor: .5, zIndex: 1 }));
  });
  filtered().forEach(p => {
    const el = makePin(SCOLOR[p.status], p.name, p.id === openId ? 'sel' : '', () => openDetail(p.id));
    overlays.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(p.lat, p.lng), content: el, xAnchor: .5, yAnchor: .5, zIndex: 3 }));
  });
}

/* ---------------- 데이터 ---------------- */
async function loadMembers() {
  const { data, error } = await sb.from('profiles').select('id,login_id,name,branch,part,role,approved').order('name');
  if (dbErr(error, '담당자 목록을 불러오지 못했습니다')) return;
  memberMap = Object.fromEntries(data.map(m => [m.id, m]));
  members = data.filter(m => m.approved && m.branch === me.branch);
  pending = data.filter(m => !m.approved && !m.branch);
  inactive = data.filter(m => !m.approved && m.branch === me.branch);
  if (me.role === '지점장') {
    $('#adminTab').hidden = false;
    $('#pendCnt').hidden = !pending.length; $('#pendCnt').textContent = pending.length;
    if (curTab === 'admin') renderAdmin();
  }
  const vis = me.role === '지점장' ? members : me.role === '파트장' ? members.filter(m => m.part === me.part) : [];
  const sel = $('#ownerFilter');
  sel.hidden = vis.length === 0;
  sel.innerHTML = `<option value="">담당자 전체</option>` + vis.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
}

function assignable() {
  if (me.role === '지점장') return members;
  if (me.role === '파트장') return members.filter(m => m.part === me.part);
  return [me];
}

async function reloadAll() {
  const [p, o, r] = await Promise.all([
    sb.from('prospects').select('*').order('updated_at', { ascending: false }),
    sb.rpc('branch_map'),
    sb.from('recontacts').select('id,prospect_id,due_date,note,user_id').eq('done', false).order('due_date')
  ]);
  if (dbErr(p.error, '영업DB를 불러오지 못했습니다')) return;
  prospects = p.data || [];
  const mine = new Set(prospects.map(x => x.id));
  others = (o.data || []).filter(x => !mine.has(x.id));
  recontacts = r.data || [];
  renderMarkers(); renderList(); renderRecontacts(); renderBadge();
  if (curTab === 'stats') renderStats();
  if (curTab === 'search') renderSearch(false);
}

let rlT;
function subscribe() {
  const reload = () => { clearTimeout(rlT); rlT = setTimeout(async () => {
    await reloadAll();
    if (openId && !prospects.find(p => p.id === openId)) closeSheet();
  }, 600); };
  sb.channel('salesmap')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prospects' }, reload)
    .subscribe();
}

/* ---------------- UI 공통 ---------------- */
function setupUI() {
  $('#legend').innerHTML = STATUS.map(s => `<span><i class="dot" style="background:${SCOLOR[s]}"></i>${s}</span>`).join('');
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    curTab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.id === 'pane-' + curTab));
    if (curTab === 'stats') renderStats();
    if (curTab === 'admin') loadMembers();
    if (curTab !== 'search') clearSearchPins();
    else renderSearch(false);
  }));

  const chips = $('#statusChips');
  chips.innerHTML = STATUS.map(s => `<button class="chip on" data-s="${s}"><i class="dot" style="background:${SCOLOR[s]}"></i>${s}<span data-c="${s}"></span></button>`).join('');
  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const s = b.dataset.s;
    filter.status.has(s) ? filter.status.delete(s) : filter.status.add(s);
    b.classList.toggle('on', filter.status.has(s));
    renderMarkers(); renderList();
  });
  $('#listQ').addEventListener('input', e => { filter.q = e.target.value.trim(); renderMarkers(); renderList(); });
  $('#ownerFilter').addEventListener('change', e => { filter.owner = e.target.value; renderMarkers(); renderList(); });
  $('#othersChk').addEventListener('change', e => { showOthers = e.target.checked; renderMarkers(); });

  $('#catChips').innerHTML = CATS.map(([c, n]) => `<button class="chip" data-c="${c}">${n}</button>`).join('');
  $('#catChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#catChips .chip').forEach(x => x.classList.toggle('on', x === b));
    places.categorySearch(b.dataset.c, searchCb, { useMapBounds: true });
  });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#searchQ').value.trim(); if (!q) return;
    document.querySelectorAll('#catChips .chip').forEach(x => x.classList.remove('on'));
    places.keywordSearch(q, searchCb, { location: map.getCenter() });
  });
  $('#manualBtn').addEventListener('click', manualRegister);

  $('#sClose').addEventListener('click', closeSheet);
  $('#regCancel').addEventListener('click', () => $('#regModal').hidden = true);
  $('#regForm').addEventListener('submit', saveRegister);

  $('#adminBox').addEventListener('click', adminClick);

  $('#pwBtn').addEventListener('click', () => { $('#pwForm').reset(); $('#pwMsg').textContent = ''; $('#pwModal').hidden = false; $('#np1').focus(); });
  $('#pwCancel').addEventListener('click', () => $('#pwModal').hidden = true);
  $('#pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('#np1').value, p2 = $('#np2').value;
    if (p1.length < 6) return $('#pwMsg').textContent = '6자 이상으로 입력하세요.';
    if (p1 !== p2) return $('#pwMsg').textContent = '비밀번호 확인이 일치하지 않습니다.';
    $('#pwSave').disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    $('#pwSave').disabled = false;
    if (error) return $('#pwMsg').textContent = /different|same/i.test(error.message) ? '기존과 다른 비밀번호를 입력하세요.' : '변경 실패: ' + error.message;
    $('#pwModal').hidden = true; toast('비밀번호를 변경했습니다');
  });

  $('#locBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return toast('위치 정보를 사용할 수 없습니다');
    navigator.geolocation.getCurrentPosition(
      pos => { map.setLevel(4); map.panTo(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude)); },
      () => toast('위치 권한을 허용해주세요'));
  });
}

function filtered() {
  const q = filter.q.toLowerCase();
  return prospects.filter(p =>
    filter.status.has(p.status) &&
    (!filter.owner || p.owner_id === filter.owner) &&
    (!q || (p.name + ' ' + (p.address || '')).toLowerCase().includes(q)));
}

function renderList() {
  STATUS.forEach(s => {
    const n = prospects.filter(p => p.status === s && (!filter.owner || p.owner_id === filter.owner)).length;
    const el = document.querySelector(`#statusChips [data-c="${s}"]`); if (el) el.textContent = ' ' + n;
  });
  const arr = filtered();
  $('#listCount').textContent = `${arr.length}건`;
  $('#list').innerHTML = arr.length ? arr.map(p => `
    <div class="item" data-id="${p.id}">
      <div class="t"><span class="nm">${esc(p.name)}</span><span class="badge" style="background:${SCOLOR[p.status]}">${p.status}</span></div>
      <div class="s">${esc(p.address || '')}</div>
      <div class="s">${esc(ownerName(p.owner_id))} · ${ymd(p.updated_at)}${p.category ? ' · ' + esc(p.category) : ''}</div>
    </div>`).join('') : `<div class="empty">등록된 영업대상이 없습니다.<br>[장소검색] 탭에서 등록해보세요.</div>`;
}
$('#list').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const p = prospects.find(x => x.id == it.dataset.id); if (!p) return;
  map.panTo(new kakao.maps.LatLng(p.lat, p.lng)); openDetail(p.id);
});

/* ---------------- 장소검색 ---------------- */
function searchCb(data, status, pagination) {
  const append = appendNext; appendNext = false;
  if (status === kakao.maps.services.Status.ZERO_RESULT) {
    if (!append) searchResults = [];
    searchPager = null; renderSearch(false); return;
  }
  if (status !== kakao.maps.services.Status.OK) return toast('검색 중 오류가 발생했습니다');
  searchResults = append ? searchResults.concat(data) : data;
  searchPager = pagination;
  renderSearch(!append);
}

function clearSearchPins() { searchOverlays.forEach(o => o.setMap(null)); searchOverlays = []; }

function dupOf(placeId) {
  const p = prospects.find(x => x.kakao_place_id === placeId);
  if (p) return { mine: true, id: p.id, owner: ownerName(p.owner_id), status: p.status };
  const o = others.find(x => x.kakao_place_id === placeId);
  if (o) return { mine: false, id: o.id, owner: o.owner_name, status: o.status };
  return null;
}

function renderSearch(fit) {
  clearSearchPins();
  const box = $('#searchList');
  if (!searchResults.length) { box.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`; return; }
  const bounds = new kakao.maps.LatLngBounds();
  box.innerHTML = searchResults.map((d, i) => {
    const dup = dupOf(d.id);
    const cat = (d.category_name || '').split('>').pop().trim();
    const btn = dup
      ? (dup.mine ? `<button class="btn sm" data-open="${dup.id}">등록됨 · 보기</button>`
                  : `<span class="muted">담당 ${esc(dup.owner)}</span>`)
      : `<button class="btn sm primary" data-reg="${i}">영업DB 등록</button>`;
    return `<div class="item" data-i="${i}">
      <div class="t"><span class="nm">${i + 1}. ${esc(d.place_name)}</span>${dup ? `<span class="badge" style="background:${SCOLOR[dup.status]}">${dup.status}</span>` : ''}</div>
      <div class="s">${esc(d.road_address_name || d.address_name)}</div>
      <div class="row" style="margin-top:6px"><span class="s" style="margin:0">${esc(cat)}${d.phone ? ' · ' + esc(d.phone) : ''}</span><span style="flex:none">${btn}</span></div>
    </div>`;
  }).join('') + (searchPager?.hasNextPage ? `<button class="btn sm" id="moreBtn" style="width:100%;margin-top:10px">결과 더 보기</button>` : '');

  if (curTab === 'search') searchResults.forEach((d, i) => {
    const pos = new kakao.maps.LatLng(+d.y, +d.x); bounds.extend(pos);
    const el = makePin('#fff', d.place_name, 'spin', () => focusSearch(i), String(i + 1));
    searchOverlays.push(new kakao.maps.CustomOverlay({ map, position: pos, content: el, xAnchor: .5, yAnchor: .5, zIndex: 5 }));
  });
  if (fit && curTab === 'search') map.setBounds(bounds);
  const more = $('#moreBtn');
  if (more) more.addEventListener('click', () => { appendNext = true; searchPager.nextPage(); });
}

function focusSearch(i) {
  const d = searchResults[i];
  map.panTo(new kakao.maps.LatLng(+d.y, +d.x));
  const it = document.querySelector(`#searchList .item[data-i="${i}"]`);
  if (it) { it.scrollIntoView({ block: 'center', behavior: 'smooth' }); it.style.background = '#fff3f4'; setTimeout(() => it.style.background = '', 1200); }
}

$('#searchList').addEventListener('click', e => {
  const reg = e.target.closest('[data-reg]');
  if (reg) {
    const d = searchResults[+reg.dataset.reg];
    return openRegister({
      name: d.place_name, address: d.road_address_name || d.address_name,
      category: (d.category_name || '').split('>').pop().trim(), phone: d.phone,
      lat: +d.y, lng: +d.x, place_id: d.id
    });
  }
  const op = e.target.closest('[data-open]');
  if (op) return openDetail(+op.dataset.open);
  const it = e.target.closest('.item');
  if (it) focusSearch(+it.dataset.i);
});

function manualRegister() {
  const c = map.getCenter();
  geocoder.coord2Address(c.getLng(), c.getLat(), (res, st) => {
    let addr = '';
    if (st === kakao.maps.services.Status.OK && res[0]) addr = res[0].road_address?.address_name || res[0].address?.address_name || '';
    openRegister({ name: '', address: addr, category: '', phone: '', lat: c.getLat(), lng: c.getLng(), place_id: null });
    toast('지도 중심 위치로 등록합니다. 위치를 옮기려면 지도를 먼저 이동하세요.');
  });
}

/* ---------------- 등록 ---------------- */
let regDraft = null;
function openRegister(d) {
  regDraft = d;
  $('#rName').value = d.name || ''; $('#rAddr').value = d.address || '';
  $('#rCat').value = d.category || ''; $('#rPhone').value = d.phone || '';
  $('#rStatus').innerHTML = opts(STATUS, '발굴');
  $('#rOwner').innerHTML = assignable().map(m => `<option value="${m.id}"${m.id === me.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
  $('#rOwner').disabled = !isLeader();
  $('#rNet').innerHTML = opts(CARRIERS, '미확인'); $('#rTv').innerHTML = opts(CARRIERS, '미확인');
  $('#rMemo').value = '';
  $('#regCoord').textContent = `위치 ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
  $('#regModal').hidden = false;
  setTimeout(() => (d.name ? $('#rStatus') : $('#rName')).focus(), 50);
}

async function saveRegister(e) {
  e.preventDefault();
  const d = regDraft; if (!d) return;
  const row = {
    name: $('#rName').value.trim(), address: $('#rAddr').value.trim() || null,
    category: $('#rCat').value.trim() || null, phone: $('#rPhone').value.trim() || null,
    lat: d.lat, lng: d.lng, kakao_place_id: d.place_id || null,
    status: $('#rStatus').value, owner_id: $('#rOwner').value || me.id,
    internet_carrier: $('#rNet').value, tv_carrier: $('#rTv').value,
    memo: $('#rMemo').value.trim() || null
  };
  if (!row.name) return toast('상호를 입력하세요');
  $('#regSave').disabled = true;
  const { data, error } = await sb.from('prospects').insert(row).select().single();
  $('#regSave').disabled = false;
  if (dbErr(error)) return;
  $('#regModal').hidden = true;
  toast(`${data.name} 등록 완료`);
  await reloadAll();
  openDetail(data.id);
}

/* ---------------- 상세 ---------------- */
function closeSheet() { $('#sheet').hidden = true; openId = null; renderMarkers(); }

async function openDetail(id) {
  const p = prospects.find(x => x.id === id);
  if (!p) return toast('조회 권한이 없는 영업대상입니다');
  openId = id; renderMarkers();
  $('#sTitle').textContent = p.name;
  $('#sheet').hidden = false;
  $('#sBody').innerHTML = `<div class="empty">불러오는 중…</div>`;
  const [a, r, s] = await Promise.all([
    sb.from('activities').select('*').eq('prospect_id', id).order('visit_date', { ascending: false }).order('id', { ascending: false }),
    sb.from('recontacts').select('*').eq('prospect_id', id).order('done').order('due_date'),
    sb.from('results').select('*').eq('prospect_id', id).order('result_date', { ascending: false })
  ]);
  if (openId !== id) return;
  renderDetail(p, a.data || [], r.data || [], s.data || []);
}

function renderDetail(p, acts, recs, ress) {
  const owners = assignable();
  const ownerCtl = isLeader()
    ? `<select id="dOwner">${owners.map(m => `<option value="${m.id}"${m.id === p.owner_id ? ' selected' : ''}>${esc(m.name)}${m.part ? ' (' + esc(m.part) + ')' : ''}</option>`).join('')}${owners.find(m => m.id === p.owner_id) ? '' : `<option selected value="${p.owner_id}">${esc(ownerName(p.owner_id))}</option>`}</select>`
    : `<b>${esc(ownerName(p.owner_id))}</b>`;
  $('#sTitle').textContent = p.name;
  $('#sBody').innerHTML = `
    <div class="sec">
      <div class="meta">
        ${p.address ? esc(p.address) + '<br>' : ''}
        ${p.category ? esc(p.category) : ''}${p.phone ? ` · <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ''}
        <br><span class="muted">등록 ${ymd(p.created_at)} · 수정 ${ymd(p.updated_at)}</span>
      </div>
      <label class="f">영업상태</label>
      <div class="steps" id="dSteps">${STATUS.map(s => `<button data-s="${s}" class="${s === p.status ? 'on' : ''}" style="${s === p.status ? `background:${SCOLOR[s]};border-color:${SCOLOR[s]}` : ''}">${s}</button>`).join('')}</div>
      <label class="f">담당자</label>${ownerCtl}
    </div>

    <div class="sec">
      <h3>상품정보</h3>
      <div class="row">
        <div><label class="f" style="margin-top:0">인터넷</label><select id="dNet">${opts(CARRIERS, p.internet_carrier || '미확인')}</select></div>
        <div><label class="f" style="margin-top:0">TV</label><select id="dTv">${opts(CARRIERS, p.tv_carrier || '미확인')}</select></div>
      </div>
      <label class="f">메모</label><textarea id="dMemo">${esc(p.memo || '')}</textarea>
      <button class="btn sm" id="dSaveInfo" style="margin-top:8px">상품정보·메모 저장</button>
    </div>

    <div class="sec">
      <h3>활동이력 <span class="muted">${acts.length}건</span></h3>
      <div class="row"><input type="date" id="aDate" value="${today()}"><select id="aKind" style="flex:.6">${opts(KINDS, '방문')}</select></div>
      <textarea id="aText" placeholder="활동 내용 (예: 사장님 면담, 현재 KT 약정 3월 만료)" style="margin-top:6px"></textarea>
      <button class="btn sm blue" id="aAdd" style="margin-top:6px">활동 추가</button>
      <div style="margin-top:8px">${acts.map(a => `
        <div class="log"><div class="lh"><b>${ymd(a.visit_date)}</b><span>${esc(a.kind)}</span><span>· ${esc(ownerName(a.user_id))}</span>${a.user_id === me.id ? `<button class="x" data-del-act="${a.id}" title="삭제">×</button>` : ''}</div>${esc(a.content).replace(/\n/g, '<br>')}</div>`).join('') || '<div class="muted">기록이 없습니다.</div>'}</div>
    </div>

    <div class="sec">
      <h3>재접촉</h3>
      <div class="row"><input type="date" id="rcDate"><input id="rcNote" placeholder="후속 내용" style="flex:1.6"></div>
      <button class="btn sm blue" id="rcAdd" style="margin-top:6px">재접촉 예약</button>
      <div style="margin-top:8px">${recs.map(r => `
        <div class="log${r.done ? ' done' : ''}"><div class="lh"><input type="checkbox" data-rc="${r.id}"${r.done ? ' checked' : ''}><b style="color:${!r.done && r.due_date < today() ? 'var(--red)' : 'inherit'}">${ymd(r.due_date)}</b><span>· ${esc(ownerName(r.user_id))}</span>${r.user_id === me.id ? `<button class="x" data-del-rc="${r.id}" title="삭제">×</button>` : ''}</div>${esc(r.note || '')}</div>`).join('') || '<div class="muted">예약된 재접촉이 없습니다.</div>'}</div>
    </div>

    <div class="sec">
      <h3>성과 <span class="muted">${ress.reduce((n, r) => n + r.qty, 0)}건</span></h3>
      <div class="row"><select id="sProd" style="flex:1.4">${opts(PRODUCTS, '인터넷')}</select><input type="number" id="sQty" min="1" value="1" style="flex:.5"><input type="date" id="sDate" value="${today()}"></div>
      <button class="btn sm blue" id="sAdd" style="margin-top:6px">성과 등록</button>
      <div style="margin-top:8px">${ress.map(r => `
        <div class="log"><div class="lh"><b>${ymd(r.result_date)}</b><span>· ${esc(ownerName(r.user_id))}</span>${r.user_id === me.id ? `<button class="x" data-del-res="${r.id}" title="삭제">×</button>` : ''}</div>${esc(r.product)} ${r.qty}건</div>`).join('') || '<div class="muted">등록된 성과가 없습니다.</div>'}</div>
    </div>

    <div class="sec"><button class="btn sm danger" id="dDel">영업대상 삭제</button></div>`;
  bindDetail(p);
}

async function updateProspect(id, patch, msg) {
  const { data, error } = await sb.from('prospects').update(patch).eq('id', id).select().maybeSingle();
  if (dbErr(error)) return null;
  if (!data) { toast('변경 후 조회 권한이 없어졌습니다'); await reloadAll(); closeSheet(); return null; }
  const i = prospects.findIndex(x => x.id === id); if (i >= 0) prospects[i] = data;
  renderMarkers(); renderList();
  if (msg) toast(msg);
  return data;
}

function bindDetail(p) {
  const id = p.id, refresh = () => openDetail(id);
  $('#dSteps').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || b.dataset.s === p.status) return;
    const d = await updateProspect(id, { status: b.dataset.s }, `상태: ${b.dataset.s}`);
    if (d) { if (d.status === '성과') toast('성과 항목에 가입상품을 등록하세요', 3500); refresh(); }
  });
  $('#dOwner')?.addEventListener('change', async e => {
    const d = await updateProspect(id, { owner_id: e.target.value }, `담당자 변경: ${ownerName(e.target.value)}`);
    if (d) refresh();
  });
  $('#dSaveInfo').addEventListener('click', () => updateProspect(id, {
    internet_carrier: $('#dNet').value, tv_carrier: $('#dTv').value, memo: $('#dMemo').value.trim() || null
  }, '저장했습니다'));

  $('#aAdd').addEventListener('click', async () => {
    const content = $('#aText').value.trim(); if (!content) return toast('활동 내용을 입력하세요');
    const { error } = await sb.from('activities').insert({ prospect_id: id, visit_date: $('#aDate').value || today(), kind: $('#aKind').value, content });
    if (dbErr(error)) return;
    if (p.status === '발굴') await updateProspect(id, { status: '접촉' }, '활동 추가 · 상태를 접촉으로 변경');
    else await updateProspect(id, { updated_at: new Date().toISOString() }, '활동을 추가했습니다');
    refresh();
  });
  $('#rcAdd').addEventListener('click', async () => {
    const due = $('#rcDate').value; if (!due) return toast('재접촉 날짜를 선택하세요');
    const { error } = await sb.from('recontacts').insert({ prospect_id: id, due_date: due, note: $('#rcNote').value.trim() || null });
    if (dbErr(error)) return;
    toast('재접촉을 예약했습니다'); await loadRecontacts(); refresh();
  });
  $('#sAdd').addEventListener('click', async () => {
    const qty = Math.max(1, parseInt($('#sQty').value) || 1);
    const { error } = await sb.from('results').insert({ prospect_id: id, product: $('#sProd').value, qty, result_date: $('#sDate').value || today() });
    if (dbErr(error)) return;
    if (p.status !== '성과') await updateProspect(id, { status: '성과' }, '성과 등록 · 상태를 성과로 변경');
    else toast('성과를 등록했습니다');
    refresh();
  });

  $('#sBody').onclick = async e => {
    const t = e.target;
    if (t.dataset.rc) {
      const { error } = await sb.from('recontacts').update({ done: t.checked }).eq('id', +t.dataset.rc);
      if (dbErr(error)) { t.checked = !t.checked; return; }
      await loadRecontacts(); refresh(); return;
    }
    const del = [['delAct', 'activities'], ['delRc', 'recontacts'], ['delRes', 'results']].find(([k]) => t.dataset[k]);
    if (del) {
      if (!confirm('삭제할까요?')) return;
      const { error } = await sb.from(del[1]).delete().eq('id', +t.dataset[del[0]]);
      if (dbErr(error, '삭제하지 못했습니다')) return;
      if (del[1] === 'recontacts') await loadRecontacts();
      refresh();
    }
  };

  $('#dDel').addEventListener('click', async () => {
    if (!confirm(`'${p.name}'과(와) 활동이력·재접촉·성과를 모두 삭제할까요?`)) return;
    const { error } = await sb.from('prospects').delete().eq('id', id);
    if (dbErr(error, '삭제하지 못했습니다')) return;
    toast('삭제했습니다'); closeSheet(); reloadAll();
  });
}

/* ---------------- 재접촉 탭 ---------------- */
async function loadRecontacts() {
  const { data } = await sb.from('recontacts').select('id,prospect_id,due_date,note,user_id').eq('done', false).order('due_date');
  recontacts = data || []; renderRecontacts(); renderBadge();
}
function renderBadge() {
  const n = recontacts.filter(r => r.due_date <= today()).length;
  $('#rcCnt').hidden = !n; $('#rcCnt').textContent = n;
}
function renderRecontacts() {
  const t = today();
  const item = r => {
    const p = prospects.find(x => x.id === r.prospect_id);
    return `<div class="item" data-id="${r.prospect_id}">
      <div class="t"><span class="nm">${esc(p?.name || '(조회 불가)')}</span><span class="muted">${ymd(r.due_date)}</span></div>
      <div class="s">${esc(r.note || '')}</div>
      <div class="s">${esc(p ? ownerName(p.owner_id) : '')}${p ? ' · ' + p.status : ''}</div></div>`;
  };
  const late = recontacts.filter(r => r.due_date < t), now = recontacts.filter(r => r.due_date === t), next = recontacts.filter(r => r.due_date > t);
  $('#rcList').innerHTML = recontacts.length
    ? (late.length ? `<div class="grp late">지연 ${late.length}</div>` + late.map(item).join('') : '')
      + (now.length ? `<div class="grp">오늘 ${now.length}</div>` + now.map(item).join('') : '')
      + (next.length ? `<div class="grp">예정 ${next.length}</div>` + next.map(item).join('') : '')
    : `<div class="empty">예정된 재접촉이 없습니다.</div>`;
}
$('#rcList').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const p = prospects.find(x => x.id == it.dataset.id); if (!p) return;
  map.panTo(new kakao.maps.LatLng(p.lat, p.lng)); openDetail(p.id);
});

/* ---------------- 현황 탭 ---------------- */
async function renderStats() {
  const box = $('#stats');
  const { data: res } = await sb.from('results').select('prospect_id,qty');
  const resBy = {};
  (res || []).forEach(r => {
    const p = prospects.find(x => x.id === r.prospect_id); if (!p) return;
    resBy[p.owner_id] = (resBy[p.owner_id] || 0) + r.qty;
  });
  const ownerIds = [...new Set(prospects.map(p => p.owner_id))];
  const rows = ownerIds.map(o => {
    const c = Object.fromEntries(STATUS.map(s => [s, prospects.filter(p => p.owner_id === o && p.status === s).length]));
    return { o, c, tot: STATUS.reduce((n, s) => n + c[s], 0), res: resBy[o] || 0 };
  }).sort((a, b) => b.res - a.res || b.tot - a.tot);
  const tc = Object.fromEntries(STATUS.map(s => [s, prospects.filter(p => p.status === s).length]));
  const total = prospects.length, totRes = rows.reduce((n, r) => n + r.res, 0);
  const t = today(), late = recontacts.filter(r => r.due_date < t).length;
  const scope = me.role === '지점장' ? `${me.branch} 전체` : me.role === '파트장' ? `${me.part} 파트` : '내 담당';

  box.innerHTML = `
    <div class="grp" style="margin-top:2px">${esc(scope)} · 영업대상 ${total}곳 · 성과 ${totRes}건${late ? ` · <span style="color:var(--red)">재접촉 지연 ${late}</span>` : ''}</div>
    <div class="bar">${total ? STATUS.map(s => `<span style="width:${tc[s] / total * 100}%;background:${SCOLOR[s]}" title="${s} ${tc[s]}"></span>`).join('') : ''}</div>
    <table class="st">
      <tr><th>담당자</th>${STATUS.map(s => `<th>${s}</th>`).join('')}<th>계</th><th>성과건</th></tr>
      ${rows.map(r => `<tr><td>${esc(ownerName(r.o))}</td>${STATUS.map(s => `<td>${r.c[s] || ''}</td>`).join('')}<td>${r.tot}</td><td><b>${r.res || ''}</b></td></tr>`).join('')}
      ${rows.length > 1 ? `<tr class="tot"><td>합계</td>${STATUS.map(s => `<td>${tc[s]}</td>`).join('')}<td>${total}</td><td>${totRes}</td></tr>` : ''}
    </table>
    ${rows.length ? '' : '<div class="empty">아직 데이터가 없습니다.</div>'}`;
}

/* ---------------- 직원 관리 (지점장) ---------------- */
function renderAdmin() {
  const parts = [...new Set(members.concat(inactive).map(m => m.part).filter(Boolean))].sort();
  const roleSel = (id, v) => `<select data-role="${id}" style="flex:.8">${opts(['매니저', '파트장', '지점장'], v || '매니저')}</select>`;
  const head = (m, extra = '') => `<div class="lh"><b style="color:var(--ink);font-size:14px">${esc(m.name)}</b><span>${esc(m.login_id)}</span>${extra}</div>`;

  const pend = pending.map(m => `
    <div class="log">${head(m)}
      <div class="row"><input list="partList" placeholder="파트 (예: 1파트)" data-part="${m.id}">${roleSel(m.id)}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-reject="${m.id}">거절</button><button class="btn sm primary" data-approve="${m.id}">승인</button></div>
    </div>`).join('') || '<div class="muted" style="padding:6px 2px">승인 대기 중인 신청이 없습니다.</div>';

  const mem = members.map(m => m.id === me.id
    ? `<div class="log">${head(m, `<span>· ${esc(m.role)} · 본인</span>`)}</div>`
    : `<div class="log">${head(m)}
        <div class="row"><input list="partList" value="${esc(m.part || '')}" placeholder="파트" data-part="${m.id}">${roleSel(m.id, m.role)}</div>
        <div class="row" style="margin-top:6px"><button class="btn sm danger" data-off="${m.id}">사용 중지</button><button class="btn sm blue" data-save="${m.id}">변경 저장</button></div>
      </div>`).join('');

  const ina = inactive.map(m => `
    <div class="log done" style="opacity:.7">${head(m, `<span>· ${esc(m.part || '')} ${esc(m.role || '')}</span>`)}
      <button class="btn sm" data-on="${m.id}">다시 사용</button>
    </div>`).join('');

  $('#adminBox').innerHTML = `
    <datalist id="partList">${parts.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div class="row" style="align-items:center"><div class="grp" style="margin:0">승인 대기 ${pending.length}</div><button class="btn sm" id="admReload" style="flex:none">새로고침</button></div>
    ${pend}
    <div class="grp">직원 ${members.length}명 · ${esc(me.branch)}</div>
    ${mem}
    ${inactive.length ? `<div class="grp">사용 중지 ${inactive.length}</div>${ina}` : ''}`;
}

async function adminClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'admReload') { await loadMembers(); return toast('새로고침했습니다'); }
  const d = b.dataset, id = d.approve || d.reject || d.save || d.off || d.on;
  if (!id) return;
  const box = $('#adminBox');
  const part = (box.querySelector(`[data-part="${id}"]`)?.value || '').trim() || null;
  const role = box.querySelector(`[data-role="${id}"]`)?.value || '매니저';
  const prof = () => sb.from('profiles');
  let q, msg;
  if (d.approve) { q = prof().update({ branch: me.branch, part, role, approved: true }).eq('id', id); msg = `${memberMap[id]?.name} 승인 완료`; }
  else if (d.reject) { if (!confirm('가입 신청을 거절할까요?')) return; q = prof().delete().eq('id', id); msg = '거절했습니다'; }
  else if (d.save) { q = prof().update({ part, role }).eq('id', id); msg = '변경했습니다'; }
  else if (d.off) { if (!confirm(`${memberMap[id]?.name}님의 사용을 중지할까요? 로그인할 수 없게 됩니다.`)) return; q = prof().update({ approved: false }).eq('id', id); msg = '사용을 중지했습니다'; }
  else { q = prof().update({ approved: true }).eq('id', id); msg = '다시 사용할 수 있게 했습니다'; }
  b.disabled = true;
  const { data, error } = await q.select();
  b.disabled = false;
  if (dbErr(error)) return;
  if (!data?.length) return toast('권한이 없습니다');
  toast(msg);
  await loadMembers(); renderList();
}

init();
</script>
</body>
</html>
